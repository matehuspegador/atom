name: Atom Dubai Kernel Build

on:
  workflow_dispatch:
  push:
    branches:
      - topaz-rebase

jobs:
  build:
    name: Build Kernel 5.4 Dubai
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Atom
      KBUILD_BUILD_HOST: GitHub-Actions

    steps:

    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: topaz-rebase


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          build-essential \
          ccache \
          curl \
          flex \
          gcc-aarch64-linux-gnu \
          git \
          libelf-dev \
          libssl-dev \
          python3 \
          unzip \
          zip


    - name: Setup ccache
      run: |
        ccache -M 5G


    # Proton Clang para Android kernel 5.4
    - name: Download Proton Clang
      run: |
        git clone --depth=1 \
          https://github.com/kdrag0n/proton-clang \
          clang


    - name: Remove embedded KernelSU
      run: |
        echo "Removendo KernelSU embutido em drivers/kernelsu..."

        rm -rf drivers/kernelsu

        # Remove a linha "source drivers/kernelsu/kernel/Kconfig" do Kconfig dos drivers
        sed -i '/kernelsu/d' drivers/Kconfig

        # Remove a linha "obj-$(CONFIG_KSU) += kernelsu/" do Makefile dos drivers
        sed -i '/kernelsu/d' drivers/Makefile

        # Remove qualquer CONFIG_KSU hardcoded no defconfig do dispositivo
        sed -i '/CONFIG_KSU/d' arch/arm64/configs/vendor/dubai-qgki_defconfig 2>/dev/null || \
        find . -maxdepth 6 -iname "dubai-qgki_defconfig" \
          -exec sed -i '/CONFIG_KSU/d' {} \; 2>/dev/null || true

        echo "Conferindo se ainda ha referencias a drivers/kernelsu:"
        grep -rn "kernelsu" drivers/Makefile drivers/Kconfig || echo "Nenhuma referencia restante."


    - name: Install KernelSU-Next
      run: |
        # De volta ao modo kprobe (tag padrao "next"). O "legacy" exige um
        # patch oficial especifico de hooks manuais (nomes de funcao/macros
        # exatos que o Kbuild reconhece) - as chamadas ksu_handle_* que
        # sobraram em fs/*.c sao de uma implementacao antiga, com assinatura
        # diferente, entao o Kbuild do legacy nao as reconhece e falha com
        # "No hooks were defined" mesmo com codigo presente no arquivo.
        # O caminho kprobe ja chegou muito perto de funcionar (Kconfig ok,
        # CONFIG_KSU=y confirmado, build avancando), so faltando o shim de
        # linux/pgtable.h que ja adicionamos - por isso voltamos pra ele.
        curl -LSs \
          "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
          | bash -


    - name: Remove stale manual KernelSU hook call sites
      run: |
        python3 - <<'EOF'
        import re

        def sub_or_die(pattern, repl, text, path, count=1):
            new_text, n = re.subn(pattern, repl, text, count=count, flags=re.DOTALL)
            if n == 0:
                raise SystemExit(f"ERRO: padrao nao encontrado em {path}: {pattern!r}")
            print(f"{path}: {n} ocorrencia(s) removida(s) para {pattern[:40]!r}...")
            return new_text

        # fs/open.c
        path = "fs/open.c"
        with open(path) as f:
            text = f.read()
        text = sub_or_die(r"extern\s+int\s+ksu_handle_faccessat\([^;]*\);\s*\n", "", text, path)
        text = sub_or_die(r"[ \t]*ksu_handle_faccessat\(&dfd,\s*&filename,\s*&mode,\s*NULL\);\s*\n", "", text, path)
        with open(path, "w") as f:
            f.write(text)

        # fs/exec.c
        path = "fs/exec.c"
        with open(path) as f:
            text = f.read()
        text = sub_or_die(
            r"extern\s+bool\s+ksu_execveat_hook[^;]*;\s*"
            r"extern\s+int\s+ksu_handle_execveat\([^;]*\);\s*"
            r"extern\s+int\s+ksu_handle_execveat_sucompat\([^;]*\);\s*\n",
            "", text, path)
        text = sub_or_die(
            r"[ \t]*if\s*\(unlikely\(ksu_execveat_hook\)\)\s*"
            r"ksu_handle_execveat\([^;]*\);\s*"
            r"else\s*"
            r"ksu_handle_execveat_sucompat\([^;]*\);\s*\n",
            "", text, path)
        with open(path, "w") as f:
            f.write(text)

        # fs/stat.c
        path = "fs/stat.c"
        with open(path) as f:
            text = f.read()
        text = sub_or_die(r"extern\s+int\s+ksu_handle_stat\([^;]*\);\s*\n", "", text, path)
        text = sub_or_die(r"[ \t]*ksu_handle_stat\(&dfd,\s*&filename,\s*&flags\);\s*\n", "", text, path)
        with open(path, "w") as f:
            f.write(text)

        # fs/read_write.c
        path = "fs/read_write.c"
        with open(path) as f:
            text = f.read()
        text = sub_or_die(
            r"extern\s+bool\s+ksu_vfs_read_hook[^;]*;\s*"
            r"extern\s+int\s+ksu_handle_vfs_read\([^;]*\);\s*\n",
            "", text, path)
        text = sub_or_die(
            r"[ \t]*if\s*\(unlikely\(ksu_vfs_read_hook\)\)\s*"
            r"ksu_handle_vfs_read\([^;]*\);\s*\n",
            "", text, path)
        with open(path, "w") as f:
            f.write(text)

        print("Todas as remocoes foram aplicadas com sucesso.")
        EOF

        echo
        echo "Conferindo se restou alguma referencia:"
        grep -rn "ksu_handle_faccessat\|ksu_execveat_hook\|ksu_handle_execveat\|ksu_handle_stat\|ksu_vfs_read_hook\|ksu_handle_vfs_read" \
          fs/exec.c fs/open.c fs/stat.c fs/read_write.c || echo "Nenhuma referencia restante."


    - name: Apply SUSFS for KernelSU-Next (kernel 5.4)
      run: |
        # Patch especifico para essa arvore de kernel 5.4, deve estar
        # commitado no repo em patches/susfs_patch_to_5_4.patch
        PATCH_FILE="patches/susfs_patch_to_5_4.patch"

        if [ ! -f "$PATCH_FILE" ]; then
          echo "ERRO: $PATCH_FILE nao encontrado no repositorio."
          echo "Suba o patch para esse caminho antes de rodar o build."
          exit 1
        fi

        patch -p1 < "$PATCH_FILE"


    - name: Add linux/pgtable.h compat shim (kernel 5.4 predates this header)
      run: |
        # drivers/kernelsu/feature/sucompat.c inclui <linux/pgtable.h>, que so
        # foi introduzido no Linux mainline a partir da ~5.9/5.10 (unificacao
        # dos headers de pgtable por arquitetura). Kernel 5.4 nao tem esse
        # arquivo, so asm/pgtable.h - e o build quebra com:
        #   fatal error: 'linux/pgtable.h' file not found
        # Solucao padrao usada por arvores de kernel antigas que recebem
        # drivers mais novos: criar um shim de compatibilidade.
        mkdir -p include/linux

        if [ ! -f include/linux/pgtable.h ]; then
          printf '%s\n' \
            '#ifndef _LINUX_PGTABLE_H' \
            '#define _LINUX_PGTABLE_H' \
            '#include <asm/pgtable.h>' \
            '#endif' \
            > include/linux/pgtable.h
          echo "Criado include/linux/pgtable.h (shim para asm/pgtable.h)."
        else
          echo "include/linux/pgtable.h ja existe no repo, nao mexi."
        fi

        echo "Conteudo final:"
        cat include/linux/pgtable.h


    - name: Add strncpy_from_user_nofault compat shim (kernel 5.4 predates the maccess rename)
      run: |
        # drivers/kernelsu/feature/sucompat.c chama strncpy_from_user_nofault(),
        # que so recebeu esse nome a partir da Linux ~5.8 (rename de
        # strncpy_from_unsafe_user). Essa arvore 5.4 QGKI nao tem nenhum dos
        # dois nomes em include/linux/uaccess.h, entao o build quebra com:
        #   implicit declaration of function 'strncpy_from_user_nofault'
        # O proprio Kbuild do KernelSU-Next faz "grep strncpy_from_user_nofault
        # include/linux/uaccess.h" pra decidir uma flag de compat - entao
        # implementamos a funcao de verdade nesse mesmo header (padrao
        # classico do kernel: pagefault_disable/enable em volta de
        # strncpy_from_user, que existe em qualquer versao).
        UACCESS_H="include/linux/uaccess.h"

        if grep -q "strncpy_from_user_nofault" "$UACCESS_H"; then
          echo "strncpy_from_user_nofault ja referenciado em $UACCESS_H, nao mexi."
        else
          printf '%s\n' \
            '' \
            '/* Compat shim: kernel 5.4 nao tem strncpy_from_user_nofault nem strncpy_from_unsafe_user. */' \
            '#ifndef _KSU_COMPAT_STRNCPY_FROM_USER_NOFAULT' \
            '#define _KSU_COMPAT_STRNCPY_FROM_USER_NOFAULT' \
            'static inline long strncpy_from_user_nofault(char *dst,' \
            '                                              const void __user *unsafe_addr,' \
            '                                              long count)' \
            '{' \
            '    long ret;' \
            '' \
            '    if (count <= 0)' \
            '        return 0;' \
            '' \
            '    pagefault_disable();' \
            '    ret = strncpy_from_user(dst, (const char __user *)unsafe_addr, count);' \
            '    pagefault_enable();' \
            '' \
            '    if (ret >= count) {' \
            '        ret = count;' \
            '        dst[count - 1] = 0;' \
            '    } else if (ret > 0) {' \
            '        dst[ret] = 0;' \
            '    }' \
            '' \
            '    return ret;' \
            '}' \
            '#endif' \
            >> "$UACCESS_H"
          echo "Adicionado wrapper strncpy_from_user_nofault em $UACCESS_H."
        fi

        echo "Conferindo:"
        tail -25 "$UACCESS_H"


    - name: Add copy_to_kernel_nofault compat shim (kernel 5.4 predates the maccess rename)
      run: |
        # drivers/kernelsu/hook/arm64/patch_memory.c chama
        # copy_to_kernel_nofault(), nome novo (Linux ~5.8+) para
        # probe_kernel_write() - usada pra escrever bytes na memoria do
        # kernel (patch das instrucoes do hook) com pagefault desabilitado.
        # Kernel 5.4 so tem o nome antigo probe_kernel_write, ja declarado
        # nesse mesmo include/linux/uaccess.h - entao so precisamos de um
        # wrapper com o nome novo por cima da funcao antiga.
        UACCESS_H="include/linux/uaccess.h"

        if grep -q "copy_to_kernel_nofault" "$UACCESS_H"; then
          echo "copy_to_kernel_nofault ja referenciado em $UACCESS_H, nao mexi."
        else
          printf '%s\n' \
            '' \
            '/* Compat shim: kernel 5.4 so tem probe_kernel_write (pre-rename). */' \
            '#ifndef _KSU_COMPAT_COPY_TO_KERNEL_NOFAULT' \
            '#define _KSU_COMPAT_COPY_TO_KERNEL_NOFAULT' \
            'static inline long copy_to_kernel_nofault(void *dst, const void *src, size_t size)' \
            '{' \
            '    return probe_kernel_write(dst, src, size);' \
            '}' \
            '#endif' \
            >> "$UACCESS_H"
          echo "Adicionado wrapper copy_to_kernel_nofault em $UACCESS_H."
        fi

        echo "Conferindo:"
        tail -15 "$UACCESS_H"


    - name: Add security_inode_init_security_anon compat shim (kernel 5.4 predates this LSM hook)
      run: |
        # drivers/kernelsu/infra/file_wrapper.c chama
        # security_inode_init_security_anon(), hook de LSM para rotular
        # inodes anonimos (anon_inode_getfile) que so foi introduzido no
        # Linux mainline bem depois da 5.4. Essa arvore 5.4 QGKI nao tem
        # essa funcao em include/linux/security.h, so a
        # security_inode_init_security "normal" - entao o build quebra com:
        #   implicit declaration of function 'security_inode_init_security_anon'
        # Como a infraestrutura de rotulagem de inode anonimo nem existe
        # nessa versao do kernel, o shim correto e um stub que retorna 0 -
        # exatamente o que a propria versao mainline faz quando
        # CONFIG_SECURITY esta desligado.
        SECURITY_H="include/linux/security.h"

        if grep -q "security_inode_init_security_anon" "$SECURITY_H"; then
          echo "security_inode_init_security_anon ja referenciado em $SECURITY_H, nao mexi."
        else
          printf '%s\n' \
            '' \
            '/* Compat shim: kernel 5.4 nao tem security_inode_init_security_anon. */' \
            '#ifndef _KSU_COMPAT_SECURITY_INODE_INIT_SECURITY_ANON' \
            '#define _KSU_COMPAT_SECURITY_INODE_INIT_SECURITY_ANON' \
            'static inline int security_inode_init_security_anon(struct inode *inode,' \
            '                                                     const struct qstr *name,' \
            '                                                     const struct inode *context_inode)' \
            '{' \
            '    return 0;' \
            '}' \
            '#endif' \
            >> "$SECURITY_H"
          echo "Adicionado stub security_inode_init_security_anon em $SECURITY_H."
        fi

        echo "Conferindo:"
        tail -15 "$SECURITY_H"


    - name: Add SECCOMP_ARCH_NATIVE_NR compat shim (kernel 5.4 predates multi-arch seccomp cache)
      run: |
        # drivers/kernelsu/infra/seccomp_cache.c usa SECCOMP_ARCH_NATIVE_NR
        # (e as macros irmas SECCOMP_ARCH_NATIVE / SECCOMP_ARCH_COMPAT*),
        # parte do cache de seccomp multi-arquitetura que so entrou no
        # Linux mainline por volta da 5.11, em
        # arch/arm64/include/asm/seccomp.h. Kernel 5.4 nao tem essas
        # defines - o build quebra com:
        #   use of undeclared identifier 'SECCOMP_ARCH_NATIVE_NR'
        # Solucao: acrescentar as mesmas defines que o upstream usa pra
        # arm64, no mesmo header arch-specific onde elas vivem de verdade.
        SECCOMP_H="arch/arm64/include/asm/seccomp.h"

        if [ ! -f "$SECCOMP_H" ]; then
          echo "AVISO: $SECCOMP_H nao encontrado, pulando shim (verifique o caminho)."
        elif grep -q "SECCOMP_ARCH_NATIVE_NR" "$SECCOMP_H"; then
          echo "SECCOMP_ARCH_NATIVE_NR ja referenciado em $SECCOMP_H, nao mexi."
        else
          printf '%s\n' \
            '' \
            '/* Compat shim: kernel 5.4 nao tem os defines de seccomp multi-arch. */' \
            '/* uapi/linux/audit.h (nao o linux/audit.h completo) - so as constantes' \
            ' * AUDIT_ARCH_*, sem arrastar o subsistema de audit inteiro. asm/seccomp.h' \
            ' * e incluido cedo demais na cadeia (antes de struct task_struct estar' \
            ' * completa, durante a geracao de asm-offsets.s) - linux/audit.h completo' \
            ' * quebra isso em cascata (\"incomplete definition of type task_struct\").' \
            ' */' \
            '#include <uapi/linux/audit.h>' \
            '#ifndef SECCOMP_ARCH_NATIVE' \
            '#define SECCOMP_ARCH_NATIVE		AUDIT_ARCH_AARCH64' \
            '#define SECCOMP_ARCH_NATIVE_NR		NR_syscalls' \
            '#define SECCOMP_ARCH_NATIVE_NAME	"aarch64"' \
            '#ifdef CONFIG_COMPAT' \
            '#ifdef CONFIG_CPU_BIG_ENDIAN' \
            '#define SECCOMP_ARCH_COMPAT		AUDIT_ARCH_ARMEB' \
            '#else' \
            '#define SECCOMP_ARCH_COMPAT		AUDIT_ARCH_ARM' \
            '#endif' \
            '#define SECCOMP_ARCH_COMPAT_NR		__NR_compat_syscalls' \
            '#define SECCOMP_ARCH_COMPAT_NAME	"arm"' \
            '#endif' \
            '#endif' \
            >> "$SECCOMP_H"
          echo "Adicionado shim SECCOMP_ARCH_NATIVE* em $SECCOMP_H."
        fi

        echo "Conferindo:"
        tail -20 "$SECCOMP_H"


    - name: Add filter_count field compat shim to struct seccomp (kernel 5.4 predates the seccomp cache rework)
      run: |
        # drivers/kernelsu/policy/app_profile.c faz
        # atomic_set(&current->seccomp.filter_count, 0). filter_count e um
        # atomic_t que so foi adicionado a struct seccomp no rework do
        # seccomp cache (~5.9, mesma leva de mudancas do
        # SECCOMP_ARCH_NATIVE_NR que ja shimamos). Kernel 5.4 so tem
        # { int mode; struct seccomp_filter *filter; } - sem contador.
        # Nada mais nessa arvore incrementa esse contador de verdade (o
        # rework completo do path de attach de filtro nao foi backportado),
        # entao o shim seguro e so extender a struct com o campo, do jeito
        # que o app_profile.c espera - atomic_set(...,0) fica um no-op
        # correto já que ninguem mais mexe nesse contador.
        SECCOMP_H="include/linux/seccomp.h"

        if grep -q "filter_count" "$SECCOMP_H"; then
          echo "filter_count ja presente em $SECCOMP_H, nao mexi."
        else
          python3 - "$SECCOMP_H" << 'PYEOF'
        import re, sys

        path = sys.argv[1]
        with open(path) as f:
            content = f.read()

        pattern = re.compile(
            r'(struct seccomp \{\s*\n'
            r'\s*int mode;\s*\n)'
            r'(\s*struct seccomp_filter \*filter;)'
        )
        m = pattern.search(content)
        if not m:
            print("ERRO: padrao 'struct seccomp { int mode; ... filter; }' nao "
                  "encontrado - abortando sem mexer no arquivo (build vai "
                  "falhar no proximo step de qualquer forma, mais seguro "
                  "que corromper o header).")
            sys.exit(1)

        replacement = (
            m.group(1)
            + "\t/* Compat shim: kernel 5.4 predates the seccomp cache rework (~5.9),\n"
            + "\t * which introduced this counter. Nothing in this tree increments it\n"
            + "\t * for real, so it just needs to exist as a valid atomic_t. */\n"
            + "\tatomic_t filter_count;\n"
            + m.group(2)
        )
        content = content[:m.start()] + replacement + content[m.end():]
        with open(path, "w") as f:
            f.write(content)
        print("Adicionado campo filter_count em " + path)
        PYEOF
        fi

        echo "Conferindo:"
        grep -n -B3 -A6 "struct seccomp {" "$SECCOMP_H"


    - name: Debug fsnotify API for pkg_observer compat (kernel 5.4 predates handle_inode_event split)
      run: |
        # drivers/kernelsu/manager/pkg_observer.c usa .handle_inode_event,
        # callback que so existe em kernels mais novos (fsnotify foi
        # dividido em handle_event / handle_inode_event por volta da 5.13).
        # Kernel 5.4 so tem o handle_event unificado e antigo. Antes de
        # escrever o shim de verdade, precisamos ver a assinatura exata
        # (nomes de enum tipo FSNOTIFY_OBJ_TYPE_INODE variam entre
        # patch levels de kernel 5.4) - entao so estamos despejando o
        # header real dessa arvore no log por enquanto.
        echo "== struct fsnotify_ops em include/linux/fsnotify_backend.h =="
        grep -n -A 15 "struct fsnotify_ops {" include/linux/fsnotify_backend.h || echo "struct fsnotify_ops nao encontrada!"

        echo
        echo "== struct fsnotify_iter_info =="
        grep -n -A 10 "struct fsnotify_iter_info {" include/linux/fsnotify_backend.h || echo "struct fsnotify_iter_info nao encontrada!"

        echo
        echo "== Enum de tipo de mark (FSNOTIFY_OBJ_TYPE_* ou FSNOTIFY_ITER_TYPE_*) =="
        grep -n "FSNOTIFY_OBJ_TYPE\|FSNOTIFY_ITER_TYPE" include/linux/fsnotify_backend.h | head -20

        echo
        echo "== Declaracao de ksu_handle_inode_event =="
        grep -rn "ksu_handle_inode_event" drivers/kernelsu/ || echo "Nao encontrada em drivers/kernelsu/"

        echo
        echo "== Trecho de drivers/kernelsu/manager/pkg_observer.c ao redor da linha 40 =="
        sed -n '1,60p' drivers/kernelsu/manager/pkg_observer.c


    - name: Patch pkg_observer.c handle_event compat wrapper (kernel 5.4 predates handle_inode_event split)
      run: |
        # Confirmado pelo dump do step anterior: kernel 5.4 so tem
        # handle_event(group, inode, mask, data, data_type, file_name,
        # cookie, iter_info) - nao existe handle_inode_event(mark, mask,
        # inode, dir, file_name, cookie) que o pkg_observer.c usa.
        # A implementacao real de ksu_handle_inode_event so usa mask e
        # file_name de fato (mark/inode/dir sao ignorados no corpo da
        # funcao), entao um wrapper com a assinatura antiga e seguro.
        PKG_OBSERVER="drivers/kernelsu/manager/pkg_observer.c"

        if grep -q "ksu_handle_event_compat" "$PKG_OBSERVER"; then
          echo "Shim ja aplicado em $PKG_OBSERVER, nao mexi."
        else
          python3 - "$PKG_OBSERVER" << 'PYEOF'
        import re, sys

        path = sys.argv[1]
        with open(path) as f:
            content = f.read()

        pattern = re.compile(
            r'static const struct fsnotify_ops ksu_ops = \{\s*\n'
            r'\s*\.handle_inode_event = ksu_handle_inode_event,\s*\n'
            r'\};'
        )
        m = pattern.search(content)
        if not m:
            print("ERRO: padrao 'ksu_ops { .handle_inode_event = ... }' nao "
                  "encontrado - abortando sem mexer no arquivo (build vai "
                  "falhar no proximo step de qualquer forma, mais seguro "
                  "que corromper o arquivo).")
            sys.exit(1)

        wrapper = (
            "/* Compat shim: kernel 5.4 so tem o handle_event unificado, nao\n"
            " * o handle_inode_event (separado a partir da ~5.13). Este\n"
            " * wrapper adapta a assinatura antiga pra chamar a\n"
            " * ksu_handle_inode_event real - que so usa mask e file_name de\n"
            " * fato, entao mark/inode/dir nao precisam ser mapeados com\n"
            " * precisao. */\n"
            "static int ksu_handle_event_compat(struct fsnotify_group *group,\n"
            "\t\t\t\t    struct inode *inode,\n"
            "\t\t\t\t    u32 mask, const void *data, int data_type,\n"
            "\t\t\t\t    const struct qstr *file_name, u32 cookie,\n"
            "\t\t\t\t    struct fsnotify_iter_info *iter_info)\n"
            "{\n"
            "\tstruct fsnotify_mark *mark = iter_info->marks[FSNOTIFY_OBJ_TYPE_INODE];\n"
            "\n"
            "\treturn ksu_handle_inode_event(mark, mask, inode, inode, file_name, cookie);\n"
            "}\n"
            "\n"
            "static const struct fsnotify_ops ksu_ops = {\n"
            "\t.handle_event = ksu_handle_event_compat,\n"
            "};"
        )

        content = content[:m.start()] + wrapper + content[m.end():]
        with open(path, "w") as f:
            f.write(content)
        print("Patch aplicado em " + path)
        PYEOF
        fi

        echo "Conferindo:"
        grep -n -B2 -A15 "ksu_handle_event_compat\|handle_event = ksu_handle_event_compat" "$PKG_OBSERVER"


    - name: Add TWA_RESUME + put_task_struct compat shim for allowlist.c (kernel 5.4 predates the task_work notify-mode enum)
      run: |
        # drivers/kernelsu/policy/allowlist.c usa task_work_add(tsk, cb,
        # TWA_RESUME) e put_task_struct(tsk). TWA_RESUME e do enum
        # task_work_notify_mode, que so entrou no Linux mainline na 5.9 -
        # antes disso task_work_add() recebia um bool notify simples.
        # TWA_RESUME no enum novo corresponde exatamente a notify=true
        # na API antiga, entao "#define TWA_RESUME true" e um shim 1:1
        # seguro. put_task_struct da erro de implicit-declaration porque
        # o arquivo nao inclui linux/sched/task.h, onde a funcao vive
        # (o arquivo ja inclui sched/task_stack.h, que so tem
        # put_task_stack - por isso o "did you mean" do compilador).
        #
        # Tentativa anterior inseria o shim depois do ULTIMO #include do
        # arquivo, mas nao ha garantia de que isso fique antes da linha
        # 482 (uso de TWA_RESUME) - se o arquivo tiver includes mais
        # abaixo (dentro de #ifdef, por exemplo), o shim chega tarde e
        # o erro continua identico. Solucao robusta: prepend no TOPO
        # absoluto do arquivo. Headers de kernel tem include guard
        # proprio, entao incluir sched/task.h antes de tudo e seguro
        # independente da ordem original dos includes.
        ALLOWLIST="drivers/kernelsu/policy/allowlist.c"

        if grep -q "_KSU_COMPAT_TWA_RESUME" "$ALLOWLIST"; then
          echo "Shim ja aplicado em $ALLOWLIST, nao mexi."
        else
          python3 - "$ALLOWLIST" << 'PYEOF'
        import sys

        path = sys.argv[1]
        with open(path) as f:
            content = f.read()

        shim = (
            "/* Compat shim: kernel 5.4 predates the task_work notify-mode enum\n"
            " * (added ~5.9). The old task_work_add() takes a plain bool notify -\n"
            " * TWA_RESUME just needs to evaluate truthy to get equivalent behavior.\n"
            " * Also pulls in put_task_struct(), missing via the headers this file\n"
            " * already includes (it has task_stack.h, which only has\n"
            " * put_task_stack(), not put_task_struct()). Prepended at the very top\n"
            " * so it is always defined before first use, regardless of where this\n"
            " * file's own #include block happens to sit. */\n"
            "#ifndef _KSU_COMPAT_TWA_RESUME\n"
            "#define _KSU_COMPAT_TWA_RESUME\n"
            "#include <linux/sched/task.h>\n"
            "#define TWA_RESUME true\n"
            "#endif\n"
            "\n"
        )

        content = shim + content
        with open(path, "w") as f:
            f.write(content)
        print("Adicionado shim TWA_RESUME + sched/task.h no topo de " + path)
        PYEOF
        fi

        echo "Conferindo (topo do arquivo):"
        head -20 "$ALLOWLIST"


    - name: Debug KernelSU-Next Kconfig wiring
      run: |
        echo "== Linha de source em drivers/Kconfig =="
        grep -n "kernelsu" drivers/Kconfig || echo "Nenhuma linha 'source' encontrada!"

        echo
        echo "== Linha de obj em drivers/Makefile =="
        grep -n "kernelsu" drivers/Makefile || echo "Nenhuma linha 'obj' encontrada!"

        echo
        echo "== drivers/kernelsu resolvido (symlink?) =="
        ls -la drivers/kernelsu || echo "drivers/kernelsu nao existe!"
        readlink -f drivers/kernelsu || true

        echo
        echo "== Stanza 'config KSU' no Kconfig do driver =="
        KSU_KCONFIG=$(readlink -f drivers/kernelsu)/Kconfig
        if [ -f "$KSU_KCONFIG" ]; then
          grep -A 6 "^config KSU$" "$KSU_KCONFIG" || echo "Simbolo 'config KSU' nao encontrado em $KSU_KCONFIG"
        else
          echo "Arquivo $KSU_KCONFIG nao existe!"
        fi


    - name: Configure kernel
      run: |

        export PATH=$PWD/clang/bin:$PATH

        make O=out \
          ARCH=arm64 \
          vendor/dubai-qgki_defconfig


    - name: Enable KPROBES/EXT4_FS deps for KernelSU-Next
      run: |
        # config KSU depends on KPROBES && EXT4_FS (ver drivers/kernelsu/Kconfig).
        # Precisa habilitar (e resolver) essa dependencia ANTES de tentar
        # habilitar KSU, senao o olddefconfig da etapa seguinte derruba o KSU
        # de volta pra "n" silenciosamente e o build passa "verde" sem KernelSU.
        #
        # KPROBES por sua vez depende de MODULES && HAVE_KPROBES (Kconfig
        # mainline). HAVE_KPROBES normalmente ja vem selecionado pelo arch
        # arm64, mas MODULES costuma estar desligado em defconfig de vendor
        # kernel monolitico - por isso habilitamos ele tambem aqui.
        scripts/config --file out/.config \
          -e MODULES \
          -e KPROBES \
          -e KPROBES_QGKI \
          -e EXT4_FS

        make O=out \
          ARCH=arm64 \
          olddefconfig

        echo "Conferindo se MODULES/KPROBES/KPROBES_QGKI/EXT4_FS realmente ficaram habilitados:"
        grep -E "^CONFIG_MODULES=|^CONFIG_KPROBES=|^CONFIG_KPROBES_QGKI=|^CONFIG_EXT4_FS=" out/.config || true

        if ! grep -q '^CONFIG_KPROBES=y' out/.config; then
          echo
          echo "AVISO: CONFIG_KPROBES ainda nao ficou =y depois do olddefconfig."
          echo "Provavelmente ha outra dependencia nao satisfeita alem de MODULES."
          echo "Diagnostico: estado atual das dependencias relevantes:"
          scripts/config --file out/.config --state MODULES || true
          scripts/config --file out/.config --state KPROBES || true
          scripts/config --file out/.config --state HAVE_KPROBES || true
          echo
          echo "Stanza(s) 'config KPROBES' / 'config HAVE_KPROBES' encontradas na arvore:"
          grep -rn -A 6 "^config KPROBES$" arch/arm64/Kconfig kernel/Kconfig* lib/Kconfig* 2>/dev/null || true
          grep -rn -A 6 "^config HAVE_KPROBES$" arch/arm64/Kconfig arch/Kconfig 2>/dev/null || true
          echo
          echo "(A etapa seguinte de verificacao final ainda vai abortar o build"
          echo "se CONFIG_KSU nao sair =y, mas esse diagnostico ajuda a achar a"
          echo "dependencia real que falta antes de tentar de novo.)"
        fi


    - name: Enable KernelSU-Next & SUSFS configs
      run: |
        scripts/config --file out/.config \
          -e KSU \
          -e KSU_SUSFS \
          -e KSU_SUSFS_SUS_PATH \
          -e KSU_SUSFS_SUS_MOUNT \
          -e KSU_SUSFS_SUS_KSTAT \
          -e KSU_SUSFS_TRY_UMOUNT \
          -e KSU_SUSFS_SPOOF_UNAME \
          -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          -e KSU_SUSFS_ENABLE_LOG

        make O=out \
          ARCH=arm64 \
          olddefconfig


    - name: Verify KernelSU-Next is actually enabled (fail build otherwise)
      run: |
        echo "Checking KernelSU-Next / SUSFS configs..."
        grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS" out/.config || true

        if ! grep -q '^CONFIG_KSU=y' out/.config; then
          echo
          echo "ERRO FATAL: CONFIG_KSU nao esta habilitado (=y) no .config final."
          echo "O olddefconfig provavelmente desligou o KSU por falta de"
          echo "KPROBES e/ou EXT4_FS. Build abortado de proposito para nao"
          echo "gerar um zip 'verde' sem KernelSU dentro."
          exit 1
        fi

        echo "OK: CONFIG_KSU=y confirmado no .config final."


    - name: Verify WiFi configs
      run: |

        echo "Checking WLAN configs..."

        grep -E \
        "CFG80211|MAC80211|CNSS|QCA|WLAN|ICNSS" \
        out/.config || true


    - name: Build kernel
      run: |

        export PATH=$PWD/clang/bin:$PATH

        make \
          -j$(nproc) \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip


    - name: Collect kernel output
      run: |

        mkdir release

        cp out/arch/arm64/boot/Image release/


        find out/arch/arm64/boot \
        -name "*.dtb" \
        -exec cp {} release/ \; || true


        find out/arch/arm64/boot \
        -name "*.dtbo" \
        -exec cp {} release/ \; || true



    - name: Clone AnyKernel3
      run: |

        git clone --depth=1 \
        https://github.com/osm0sis/AnyKernel3 \
        anykernel


    - name: Prepare AnyKernel3
      run: |

        cp release/* anykernel/


        cd anykernel


        # Edge 30 A/B
        sed -i \
        's/do.devicecheck=.*/do.devicecheck=0/' \
        anykernel.sh || true


        sed -i \
        's/device.name1=.*/device.name1=dubai/' \
        anykernel.sh || true



    - name: Build Flashable ZIP
      run: |

        cd anykernel

        zip -r9 \
        ../Atom-Dubai-Kernel.zip \
        . \
        -x "*.git*"



    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:

        name: Atom-Dubai-Kernel

        path: Atom-Dubai-Kernel.zip
