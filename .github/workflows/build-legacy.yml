name: Atom Dubai Kernel Build

on:
  workflow_dispatch:
  push:
    branches:
      - topaz-rebase

jobs:
  build:
    name: Build Kernel 5.4 Dubai
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Atom
      KBUILD_BUILD_HOST: GitHub-Actions

    steps:

    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: topaz-rebase


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          build-essential \
          ccache \
          curl \
          flex \
          gcc-aarch64-linux-gnu \
          git \
          libelf-dev \
          libssl-dev \
          python3 \
          unzip \
          zip


    - name: Setup ccache
      run: |
        ccache -M 5G


    # Proton Clang para Android kernel 5.4
    - name: Download Proton Clang
      run: |
        git clone --depth=1 \
          https://github.com/kdrag0n/proton-clang \
          clang


    - name: Remove embedded KernelSU
      run: |
        echo "Removendo KernelSU embutido em drivers/kernelsu..."

        rm -rf drivers/kernelsu

        # Remove a linha "source drivers/kernelsu/kernel/Kconfig" do Kconfig dos drivers
        sed -i '/kernelsu/d' drivers/Kconfig

        # Remove a linha "obj-$(CONFIG_KSU) += kernelsu/" do Makefile dos drivers
        sed -i '/kernelsu/d' drivers/Makefile

        # Remove qualquer CONFIG_KSU hardcoded no defconfig do dispositivo
        sed -i '/CONFIG_KSU/d' arch/arm64/configs/vendor/dubai-qgki_defconfig 2>/dev/null || \
        find . -maxdepth 6 -iname "dubai-qgki_defconfig" \
          -exec sed -i '/CONFIG_KSU/d' {} \; 2>/dev/null || true

        echo "Conferindo se ainda ha referencias a drivers/kernelsu:"
        grep -rn "kernelsu" drivers/Makefile drivers/Kconfig || echo "Nenhuma referencia restante."


    - name: Install KernelSU-Next
      run: |
        # De volta ao modo kprobe (tag padrao "next"). O "legacy" exige um
        # patch oficial especifico de hooks manuais (nomes de funcao/macros
        # exatos que o Kbuild reconhece) - as chamadas ksu_handle_* que
        # sobraram em fs/*.c sao de uma implementacao antiga, com assinatura
        # diferente, entao o Kbuild do legacy nao as reconhece e falha com
        # "No hooks were defined" mesmo com codigo presente no arquivo.
        # O caminho kprobe ja chegou muito perto de funcionar (Kconfig ok,
        # CONFIG_KSU=y confirmado, build avancando), so faltando o shim de
        # linux/pgtable.h que ja adicionamos - por isso voltamos pra ele.
        curl -LSs \
          "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" \
          | bash -

