name: AtomX Dubai - KernelSU Next Legacy

on:
  workflow_dispatch:
  push:
    branches: [ topaz-rebase ]

jobs:
  build:
    name: Build Kernel 5.4 + KSU Next Legacy
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      KBUILD_BUILD_USER: Atom
      KBUILD_BUILD_HOST: GitHub-Actions

    steps:
      - uses: actions/checkout@v4
        with:
          ref: topaz-rebase

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install -y \
            bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu git libelf-dev libssl-dev python3 unzip zip

      - name: Setup ccache
        run: ccache -M 8G

      - name: Download Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      # ==================== REMOVER KERNELSU ANTIGO ====================
      - name: Remove Old KernelSU
        run: |
          echo "🗑️ Removendo KernelSU embutido..."
          rm -rf drivers/kernelsu 2>/dev/null || true
          
          sed -i '/kernelsu/d' drivers/Kconfig 2>/dev/null || true
          sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true
          
          sed -i '/CONFIG_KSU/d' arch/arm64/configs/vendor/dubai-qgki_defconfig 2>/dev/null || true
          echo "✅ KernelSU antigo removido."

      # ==================== INSTALAR KERNELSU NEXT LEGACY ====================
      - name: Install KernelSU Next Legacy
        run: |
          echo "📥 Instalando KernelSU Next (Legacy)..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          # Garantia extra para kernels 5.4
          echo "🔧 Verificando Kconfig..."
          if [ -f drivers/kernelsu/kernel/Kconfig ]; then
            echo "✅ Kconfig encontrado em drivers/kernelsu/kernel/Kconfig"
            
            # Força inclusão do Kconfig se o setup.sh não fez
            if ! grep -q "kernelsu/kernel/Kconfig" drivers/Kconfig; then
              sed -i '/endmenu/i\source "drivers/kernelsu/kernel/Kconfig"' drivers/Kconfig
              echo "✅ Kconfig incluído manualmente"
            fi
          else
            echo "⚠️ Kconfig não encontrado!"
          fi

      # ==================== BUILD ====================
      - name: Build Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          
          make O=out ARCH=arm64 vendor/dubai-qgki_defconfig \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo "🚀 Compilando com KernelSU Next..."
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- 2>&1 | tee build.log

      - name: Pack AnyKernel
        run: ./build.sh

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: AtomX-Dubai-KSU-Next-Legacy
          path: "*.zip"
