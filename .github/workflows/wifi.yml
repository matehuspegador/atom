name: Compare WiFi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-wifi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Atom
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone base kernel
        run: |
          git clone --depth=1 \
            -b topaz-wip \
            https://github.com/SM7325-AE/android_kernel_motorola_dubai.git \
            base

      - name: Show repository tree
        run: |
          echo "===== Current repo ====="
          find . -maxdepth 3 -type d | sort

          echo
          echo "===== Base repo ====="
          find base -maxdepth 3 -type d | sort

      - name: Generate diffs
        shell: bash
        run: |
          mkdir -p diff

          compare() {
            DIR="$1"
            OUT="diff/${DIR//\//_}.diff"

            if [ ! -d "base/$DIR" ]; then
              echo "Missing in base: $DIR"
              return
            fi

            if [ ! -d "$DIR" ]; then
              echo "Missing in current repo: $DIR"
              return
            fi

            git diff --no-index \
              "base/$DIR" \
              "$DIR" \
              > "$OUT" || true

            if [ ! -s "$OUT" ]; then
              rm -f "$OUT"
            fi
          }

          compare "drivers/staging/qcacld-3.0"
          compare "drivers/staging/qca-wifi-host-cmn"
          compare "drivers/net/wireless/cnss2"
          compare "include"
          compare "net"

      - name: Compare defconfig
        shell: bash
        run: |
          CONF="arch/arm64/configs/vendor/dubai-qgki_defconfig"

          if [ -f "base/$CONF" ] && [ -f "$CONF" ]; then
            git diff --no-index \
              "base/$CONF" \
              "$CONF" \
              > diff/dubai-qgki_defconfig.diff || true

            if [ ! -s diff/dubai-qgki_defconfig.diff ]; then
              rm -f diff/dubai-qgki_defconfig.diff
            fi
          else
            echo "Defconfig not found."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wifi-comparison
          path: diff
          if-no-files-found: warn
