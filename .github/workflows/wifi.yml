name: Compare WiFi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            drivers/staging/qcacld-3.0
            drivers/staging/qca-wifi-host-cmn
            drivers/net/wireless/cnss2
            include
            net
            arch/arm64/configs/vendor

      - name: Clone base kernel
        run: |
          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            -b topaz-rebase \
            https://github.com/SM7325-AE/android_kernel_motorola_dubai.git \
            base

          cd base

          git sparse-checkout set \
            drivers/staging/qcacld-3.0 \
            drivers/staging/qca-wifi-host-cmn \
            drivers/net/wireless/cnss2 \
            include \
            net \
            arch/arm64/configs/vendor

      - name: Generate diffs
        shell: bash
        run: |
          mkdir -p diff

          compare() {
            SRC="base/$1"
            DST="$1"
            OUT="diff/${1//\//_}.diff"

            if [ -e "$SRC" ] && [ -e "$DST" ]; then
              git diff --no-index "$SRC" "$DST" > "$OUT" || true

              if [ ! -s "$OUT" ]; then
                rm -f "$OUT"
              fi
            else
              echo "Skipping $1"
            fi
          }

          compare drivers/staging/qcacld-3.0
          compare drivers/staging/qca-wifi-host-cmn
          compare drivers/net/wireless/cnss2
          compare include
          compare net
          compare arch/arm64/configs/vendor/dubai-qgki_defconfig

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wifi-comparison
          path: diff
          if-no-files-found: warn
