name: Compare WiFi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-wifi:
    name: Compare WiFi sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Atom
        uses: actions/checkout@v4
        # fetch-depth: 0 FOI REMOVIDO AQUI (Agora baixa apenas o commit atual, sendo instantâneo)

      - name: Clone Lineage base
        run: |
          git clone --depth=1 \
            -b topaz-wip \
            https://github.com/SM7325-AE/android_kernel_motorola_dubai.git \
            base

      - name: Generate diffs
        shell: bash
        run: |
          set +e
          mkdir -p diff

          compare() {
            DIR="$1"
            OUT="diff/$(echo "$DIR" | tr '/' '_').diff"

            if [ -d "base/$DIR" ] && [ -d "$DIR" ]; then
              git diff --no-index "base/$DIR" "$DIR" > "$OUT"
              [ ! -s "$OUT" ] && rm -f "$OUT"
            fi
          }

          compare drivers/staging/qcacld-3.0
          compare drivers/staging/qca-wifi-host-cmn
          compare drivers/net/wireless/cnss2
          compare include
          compare net

      - name: Compare defconfig
        shell: bash
        run: |
          CONF=arch/arm64/configs/vendor/dubai-qgki_defconfig

          if [ -f "base/$CONF" ] && [ -f "$CONF" ]; then
            git diff --no-index "base/$CONF" "$CONF" > diff/dubai-qgki_defconfig.diff
            [ ! -s diff/dubai-qgki_defconfig.diff ] && rm -f diff/dubai-qgki_defconfig.diff
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wifi-comparison
          path: diff
          if-no-files-found: warn
          
