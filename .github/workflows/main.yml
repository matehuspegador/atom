name: AtomX Dubai - KernelSU Next Legacy

on:
  workflow_dispatch:
  push:
    branches: [ topaz-rebase ]

jobs:
  build:
    name: Build Kernel 5.4 + KSU Next
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      KBUILD_BUILD_USER: Atom
      KBUILD_BUILD_HOST: GitHub-Actions

    steps:
      - uses: actions/checkout@v4
        with:
          ref: topaz-rebase

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install -y \
            bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu git libelf-dev libssl-dev python3 unzip zip

      - name: Setup ccache + Clang
        run: |
          ccache -M 8G
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Remove Old KernelSU
        run: |
          rm -rf drivers/kernelsu 2>/dev/null || true
          sed -i '/kernelsu/d' drivers/Kconfig drivers/Makefile 2>/dev/null || true
          sed -i '/CONFIG_KSU/d' arch/arm64/configs/vendor/dubai-qgki_defconfig 2>/dev/null || true

      - name: Install KernelSU Next
        run: |
          echo "📥 Instalando KernelSU Next Legacy..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Apply Custom Patches
        run: |
          echo "🔧 Aplicando patches da pasta patches/..."
          
          if [ -d patches ]; then
            for patch in patches/*.patch; do
              if [ -f "$patch" ]; then
                echo "Aplicando: $patch"
                git apply --ignore-whitespace "$patch" || echo "⚠️  Falha ao aplicar $patch (pode já estar aplicado)"
              fi
            done
            echo "✅ Patches aplicados!"
          else
            echo "⚠️ Pasta patches/ não encontrada!"
          fi

          # Força CONFIG_KSU=y
          echo -e "\n# KernelSU Next\nCONFIG_KSU=y" >> arch/arm64/configs/vendor/dubai-qgki_defconfig

      - name: Build Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"

          make O=out ARCH=arm64 vendor/dubai-qgki_defconfig \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- 2>&1 | tee build.log

      - name: Verify KernelSU
        run: |
          if grep -q "^CONFIG_KSU=y" out/.config; then
            echo "✅ KernelSU Next integrado com sucesso!"
          else
            echo "❌ CONFIG_KSU não encontrado!"
            exit 1
          fi

      - name: Pack AnyKernel3
        run: ./build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtomX-Dubai-KernelSU-Next-Legacy
          path: "*.zip"
