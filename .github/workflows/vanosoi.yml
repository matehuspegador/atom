name: Build AtomX Kernel (KernelSU-Next legacy)

# ---------------------------------------------------------------------------
# This workflow:
#   1. Checks out the kernel source
#   2. Deletes the old drivers/kernelsu (legacy KernelSU) driver
#   3. Fetches KernelSU-Next using its "legacy" (manual-hook) setup, which is
#      the supported path for pre-GKI / 5.4-class kernels
#   4. Flips the defconfig to manual-hook mode (kprobes off, CONFIG_KSU on)
#   5. Best-effort auto-patches the manual hooks that KernelSU-Next needs
#      (fs/exec.c, fs/read_write.c, fs/devpts/inode.c, drivers/input/input.c)
#   6. Builds the kernel and uploads Image/dtbo as artifacts
#
# IMPORTANT — read before running:
#   - The defconfig path/name and build command below are best guesses based
#     on the file names visible in the repo (build.config.msm.lahaina, the
#     arch/arm64/configs tree, build.sh). Confirm/adjust the `defconfig` and
#     `build_config` workflow inputs for your actual target before running.
#   - The auto-patch step is anchor-based (it looks for known, stable lines
#     from the official KernelSU non-GKI guide) so it survives most kernel
#     trees, but it is NOT a substitute for reviewing the diff it produces.
#     The job uploads a patch-report.txt artifact — check it.
#   - fs/namespace.c is auto-patched with the official can_umount/path_umount
#     backport (needed on any kernel < 5.9 for the KernelSU "module umount"
#     feature, and to avoid an "undefined symbol: path_umount" link error --
#     see the "Backport path_umount" step). Like the other hooks, it's
#     anchor-based, so check patch-report.txt if it reports a FAIL for
#     fs/namespace.c.
#
# ANTI "WRONG .KO FROM ANOTHER COMMIT" HARDENING (added):
#   - "Full clean" step: unconditional `make mrproper` + `rm -rf out` + a
#     sweep for stray *.ko/Module.symvers anywhere in the tree, right before
#     the build, every run. No leftover object/module from a previous
#     pass/commit can survive into this run's output.
#   - Build now runs with LLVM=1 LLVM_IAS=1 (full clang/lld toolchain, no
#     mixed GNU binutils) for consistent, reproducible module ABI.
#   - "Validate Module.symvers": fails the job if Module.symvers is missing,
#     empty, or older than vmlinux (i.e. stale/not from this final link).
#   - "Verify vermagic": extracts this build's real UTS_RELEASE and checks
#     EVERY .ko's embedded vermagic string against it. Any mismatch — i.e.
#     any module actually built for a different commit — FAILS THE JOB
#     before packaging/upload ever sees it.
#   - "Package vendor_dlkm / system_dlkm modules": sorts vermagic-verified
#     modules onto their correct partition (by manifest when the tree ships
#     one) and zips them separately.
#   - "Locate a vendor_boot image": best-effort passthrough if one exists.
#   - Artifacts now include Image, Image.gz, dtbo.img, vendor_boot (when
#     found), vendor_dlkm/system_dlkm module zips, standalone .ko files, and
#     a dedicated debug-logs artifact (vermagic-report.txt, Module.symvers,
#     full build log, extracted error lines, patch-report.txt).
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name, no _defconfig suffix"
        required: true
        default: "vendor/dubai-qgki"
      arch:
        description: "Kernel arch"
        required: true
        default: "arm64"
      ksu_ref:
        description: "KernelSU-Next setup.sh ref to use (legacy = manual-hook path for old/5.4-class kernels)"
        required: true
        default: "legacy"
      build_config:
        description: "build.config.* file to pass to build.sh (leave blank to fall back to plain make — confirm the right build.config.* for dubai/SM7325 in the repo before setting this)"
        required: false
        default: ""
      clang_repo:
        description: "Proton Clang source. kdrag0n's original is frozen/archived, which is exactly why it's the recommended pick for 5.4-class kernels — it stopped updating right around the LLVM version most CAF/QGKI 5.4 trees were validated against. Newer clang releases are more likely to choke on old kernel C."
        required: true
        default: "https://github.com/kdrag0n/proton-clang"
      lock_localversion:
        description: "Exact LOCALVERSION suffix to force (e.g. '-moto-gXXXXXXX-ab123456'). Get this ONCE from a full crDroid ROM build via `strings out/vmlinux | grep -m1 vermagic` (or `modinfo wlan.ko`) on the build that produced your vendor_boot/vendor_dlkm .ko files, then paste it here so every future kernel-only build here keeps matching those modules. Leave blank to skip (kernel keeps its tree-default version string, which will NOT match prebuilt vendor modules)."
        required: false
        default: ""
  push:
    branches: [ topaz-rebase ]

env:
  KSU_SETUP_URL: https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize submodules (best-effort, timed, non-interactive)
        timeout-minutes: 15
        run: |
          set -e
          export GIT_TERMINAL_PROMPT=0

          if [ ! -f .gitmodules ]; then
            echo "No .gitmodules — nothing to do."
            exit 0
          fi

          echo "---- .gitmodules ----"
          cat .gitmodules

          git submodule sync --recursive

          # Non-blocking: if a submodule is private/unreachable/huge, don't let
          # it hang the whole job forever — `timeout` kills it, and we log a
          # warning instead of failing. Most kernel builds don't strictly need
          # every vendor/device submodule just to compile the kernel image.
          if ! timeout 600 git submodule update --init --recursive --depth 1; then
            echo "::warning::Submodule init timed out or failed for one or more submodules. Continuing without them — if the build fails later needing a missing path, that submodule is actually required and needs a token/deploy key set up in repo Settings > Secrets."
          fi

      - name: Ensure Wi-Fi / FM radio driver source is actually present
        # WHY THIS STEP EXISTS:
        #
        # The "Initialize submodules" step above treats submodule failures as
        # non-fatal (it only prints ::warning:: and moves on) -- that's fine
        # for optional vendor/device submodules the kernel doesn't strictly
        # need to compile, but it's exactly the wrong behavior for
        # drivers/staging/qcacld-3.0 and drivers/staging/qca-wifi-host-cmn
        # (the real Qualcomm Wi-Fi driver source) and the FM radio driver
        # directory: if either of those failed to init, this tree ends up
        # with an empty directory, the later "Build wifi/network drivers as
        # loadable modules" step silently finds nothing to convert there,
        # and the build "succeeds" while producing a kernel with no matching
        # wifi/FM .ko at all -- which is the version-magic-mismatch problem
        # this whole workflow exists to fix. Fail loudly here instead, before
        # hours of build time get spent on a kernel that can't have working
        # Wi-Fi/FM no matter what.
        run: |
          set -e

          check_populated() {
            local dir="$1"
            local min_files="${2:-20}"
            [ -d "$dir" ] || { echo "missing"; return; }
            # NOTE: don't gate on Makefile/Kbuild presence -- qca-wifi-host-cmn
            # in particular is a "common" library with NO top-level
            # Makefile/Kbuild even when fully populated (it's referenced by
            # qcacld-3.0's own Kbuild via WLAN_COMMON_ROOT/WLAN_COMMON_INC,
            # not built standalone). A file-count check is what actually
            # tells empty/failed-submodule apart from real source -- but the
            # threshold has to scale with how big that particular driver
            # legitimately is (qcacld-3.0/qca-wifi-host-cmn are huge; a
            # single-chip FM radio driver is legitimately just a handful of
            # files), so it's a parameter instead of one fixed number.
            local count
            count=$(find "$dir" -type f \( -iname "*.c" -o -iname "*.h" -o -iname "Makefile" -o -iname "Kbuild" \) 2>/dev/null | wc -l)
            if [ "$count" -ge "$min_files" ]; then
              echo "ok"
            else
              echo "empty"
            fi
          }

          MISSING=""

          for d in drivers/staging/qcacld-3.0 drivers/staging/qca-wifi-host-cmn; do
            STATUS=$(check_populated "$d")
            echo "  $d -> $STATUS"
            [ "$STATUS" = "ok" ] || MISSING="$MISSING $d"
          done

          # FM radio driver directory name varies by tree -- try the common
          # locations instead of assuming one.
          FM_DIR=""
          for candidate in drivers/media/radio/radio-i2c-rtc6226-qca drivers/media/radio/rtc6226 drivers/staging/radio-rtc6226; do
            if [ -d "$candidate" ]; then
              FM_DIR="$candidate"
              break
            fi
          done
          if [ -n "$FM_DIR" ]; then
            STATUS=$(check_populated "$FM_DIR" 2)
            echo "  $FM_DIR -> $STATUS"
            [ "$STATUS" = "ok" ] || MISSING="$MISSING $FM_DIR"
            echo "fm_dir=${FM_DIR}" >> "$GITHUB_OUTPUT" 2>/dev/null || true
          else
            echo "  No FM radio driver directory found under drivers/media/radio or drivers/staging -- if this device has FM radio, its source may live elsewhere; adjust this step's candidate list."
          fi

          if [ -n "$MISSING" ]; then
            {
              echo "## ❌ Wi-Fi / FM driver source missing"
              echo
              echo "The following driver directories are empty or absent, which means the resulting kernel will NOT have a matching Wi-Fi/FM \`.ko\` (this is the exact version-magic-mismatch bug):"
              echo '```'
              echo "$MISSING"
              echo '```'
              echo
              echo "These are normally populated by git submodules pointing at:"
              echo "- https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qcacld-3.0"
              echo "- https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qca-wifi-host-cmn"
              echo
              echo "Check this run's earlier **Initialize submodules** step log for the actual clone error (auth/timeout/private repo), fix access (deploy key or PAT in repo Settings > Secrets), and re-run. This job is stopping now on purpose instead of shipping a kernel with broken Wi-Fi/FM."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Wi-Fi/FM driver source is missing:$MISSING — see the Summary tab for details. Stopping before the build instead of shipping a kernel that will repeat the version-magic mismatch."
            exit 1
          fi

          echo "All Wi-Fi/FM driver source directories are populated. Proceeding."

      - name: Lock LOCALVERSION to match prebuilt vendor modules
        # See the `lock_localversion` input description for how to obtain
        # this value. Setting it here means `strings out/vmlinux | grep
        # vermagic` on THIS build's output will match whatever .ko files you
        # already have from the one-time full ROM build (see the "Ensure
        # Wi-Fi / FM radio driver source is actually present" step for the
        # in-tree module path instead, which is the actual fix when the
        # submodules build successfully; this LOCALVERSION lock is the
        # fallback for any module you're still sourcing from a separate
        # full-ROM build's vendor_boot/vendor_dlkm).
        if: ${{ github.event.inputs.lock_localversion != '' }}
        run: |
          set -e
          LV="${{ github.event.inputs.lock_localversion }}"
          echo "Forcing LOCALVERSION=$LV"
          # CONFIG_LOCALVERSION in the defconfig is the most reliable place —
          # it survives `make oldconfig`/olddefconfig, unlike a plain
          # .scmversion or EXTRAVERSION edit which some CAF trees overwrite
          # during the build (setlocalversion script).
          echo "$LV" > .scmversion
          if [ -f scripts/setlocalversion ]; then
            chmod +x scripts/setlocalversion
          fi
          {
            echo "## LOCALVERSION locked"
            echo
            echo "Forced to: \`$LV\` (via \`.scmversion\`) so this build's vermagic matches the modules from your last full ROM build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            git libncurses-dev libssl-dev python3 rsync unzip zip \
            libelf-dev lz4 dwarves device-tree-compiler

      - name: Fetch Proton Clang toolchain
        timeout-minutes: 15
        run: |
          set -e
          git clone --depth=1 "${{ github.event.inputs.clang_repo || 'https://github.com/kdrag0n/proton-clang' }}" "$GITHUB_WORKSPACE/proton-clang"

          CLANG_BIN="$GITHUB_WORKSPACE/proton-clang/bin"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/proton-clang/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

          # Old (pre-5.9) CAF/QGKI Makefiles look for CROSS_COMPILE_ARM32;
          # kernels 4.19+ use the upstream CROSS_COMPILE_COMPAT name instead.
          # Set both so whichever this tree expects is covered.
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=$GITHUB_WORKSPACE/proton-clang/bin/aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/proton-clang/bin/arm-linux-gnueabi-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_COMPAT=$GITHUB_WORKSPACE/proton-clang/bin/arm-linux-gnueabi-" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"

          # Full LLVM build: LLVM=1 tells the kernel Makefile to source
          # every tool (CC, LD, AR, NM, OBJCOPY, OBJDUMP, STRIP, READELF) from
          # the LLVM/clang toolchain instead of mixing in GNU binutils. Mixed
          # GNU-ld + clang builds are exactly what produces subtly-different
          # module ABI / vermagic drift between runs on 5.4-class Qualcomm
          # trees (Topaz/Atom included) -- pinning LLVM=1 end to end keeps the
          # object code and modversions consistent build-to-build.
          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=1" >> "$GITHUB_ENV"

          {
            echo "## Toolchain"
            echo
            echo "Using \`${{ github.event.inputs.clang_repo || 'https://github.com/kdrag0n/proton-clang' }}\`:"
            echo '```'
            "$CLANG_BIN/clang" --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove legacy KernelSU driver (drivers/kernelsu)
        run: |
          set -e
          if [ -d drivers/kernelsu ] || [ -L drivers/kernelsu ]; then
            echo "Removing existing drivers/kernelsu ..."
            rm -rf drivers/kernelsu
          else
            echo "No drivers/kernelsu present, nothing to remove."
          fi

          # Strip old KernelSU references from drivers/Kconfig and drivers/Makefile
          # so the tree doesn't try to build/link a directory that no longer exists.
          for f in drivers/Kconfig drivers/Makefile; do
            if [ -f "$f" ]; then
              cp "$f" "$f.bak"
              grep -inE 'kernelsu|CONFIG_KSU' "$f" > "$f.removed.txt" || true
              sed -i '/kernelsu/Id' "$f"
              sed -i '/CONFIG_KSU\b/Id' "$f"
              echo "---- lines stripped from $f ----"
              cat "$f.removed.txt" || true
            fi
          done

      - name: Fetch KernelSU-Next (legacy / manual-hook setup)
        timeout-minutes: 10
        run: |
          set -e
          curl -LSs "$KSU_SETUP_URL" | bash -s ${{ github.event.inputs.ksu_ref || 'legacy' }}
          echo "KernelSU-Next added at:"
          ls -la KernelSU-Next 2>/dev/null || ls -la drivers/kernelsu 2>/dev/null || true

      - name: Discover defconfig & build layout (no terminal needed — read this in the Summary tab)
        id: discover
        run: |
          set -e
          ARCH="${{ github.event.inputs.arch || 'arm64' }}"
          WANTED="${{ github.event.inputs.defconfig || 'vendor/dubai-qgki' }}"
          WANTED_PATH="arch/${ARCH}/configs/${WANTED}_defconfig"

          {
            echo "## Kernel build layout discovery"
            echo
            echo "Requested defconfig: \`${WANTED}_defconfig\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$WANTED_PATH" ]; then
            FOUND_PATH="$WANTED_PATH"
            echo "Found requested defconfig at \`$FOUND_PATH\` ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Not found at \`$WANTED_PATH\` — searching the tree for anything matching *dubai*..." >> "$GITHUB_STEP_SUMMARY"
            # Try to auto-match a dubai/qgki defconfig anywhere under arch/*/configs
            CANDIDATE=$(find arch -type f -iname "*dubai*defconfig*" 2>/dev/null | head -n1 || true)
            if [ -z "$CANDIDATE" ]; then
              CANDIDATE=$(find arch -type f -iname "*defconfig*" 2>/dev/null | grep -i qgki | head -n1 || true)
            fi
            if [ -n "$CANDIDATE" ]; then
              FOUND_PATH="$CANDIDATE"
              echo "Auto-detected candidate defconfig: \`$FOUND_PATH\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ Could not auto-detect any defconfig. Every defconfig-like file found in the repo:" >> "$GITHUB_STEP_SUMMARY"
              find arch -iname "*defconfig*" 2>/dev/null | sed 's/^/- `/;s/$/`/' >> "$GITHUB_STEP_SUMMARY" || true
              echo "::error::No defconfig found. Open this run's Summary tab, pick the right path from the list, and re-run with the 'defconfig' input set to that path (relative to arch/<ARCH>/configs, without the _defconfig suffix)."
              exit 1
            fi
          fi

          echo "defconfig_path=${FOUND_PATH}" >> "$GITHUB_OUTPUT"

          # QGKI kernels often need fragments merged via scripts/gki/generate_defconfig.sh
          # before the defconfig is complete — detect and note that.
          if [ -f scripts/gki/generate_defconfig.sh ]; then
            echo "Detected \`scripts/gki/generate_defconfig.sh\` (QGKI fragment generator) — will run it before building." >> "$GITHUB_STEP_SUMMARY"
            echo "has_generate_defconfig=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_generate_defconfig=false" >> "$GITHUB_OUTPUT"
          fi

          # Look for a build.sh + build.config.* pair (common in QCOM/CAF-derived trees)
          BC=$(find . -maxdepth 1 -iname "build.config*" 2>/dev/null | grep -iE 'dubai|qgki' | head -n1 || true)
          if [ -z "$BC" ]; then
            BC=$(find . -maxdepth 1 -iname "build.config*" 2>/dev/null | head -n1 || true)
          fi
          # IMPORTANT: `actions/checkout` does not always preserve the executable
          # bit (depends on the repo's git history / core.fileMode), so gating on
          # `[ -x build.sh ]` alone silently falls back to plain `make` even when
          # build.sh is present and perfectly usable -- and plain `make` neither
          # merges QGKI defconfig fragments the way build.sh does nor packages an
          # AnyKernel3 zip, which is exactly the "no Image, no anykernel" failure
          # mode this was hit by. Force the bit on instead of just checking it.
          if [ -f build.sh ]; then
            chmod +x build.sh
          fi
          if [ -n "$BC" ] && [ -x build.sh ]; then
            echo "Detected build script: \`build.sh\` with \`${BC#./}\` — will use it (it also packages the AnyKernel3 zip)." >> "$GITHUB_STEP_SUMMARY"
            echo "build_config=${BC#./}" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No usable build.sh/build.config.* pair detected (build.sh present: $([ -f build.sh ] && echo yes || echo no)) — will fall back to plain \`make\`. Plain \`make\` only produces a raw \`Image\`; it does NOT package an AnyKernel3 zip. If this repo is supposed to build one, fix/commit build.sh or use the dedicated packaging step added below." >> "$GITHUB_STEP_SUMMARY"
            echo "build_config=" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable manual-hook mode in defconfig
        run: |
          set -e
          DEFCONFIG_PATH="${{ steps.discover.outputs.defconfig_path }}"

          echo "Patching $DEFCONFIG_PATH"
          cp "$DEFCONFIG_PATH" "$DEFCONFIG_PATH.bak"

          set_cfg() {
            local key="$1" val="$2"
            sed -i "/^${key}=/d" "$DEFCONFIG_PATH"
            sed -i "/^# ${key} is not set/d" "$DEFCONFIG_PATH"
            echo "${key}=${val}" >> "$DEFCONFIG_PATH"
          }
          unset_cfg() {
            local key="$1"
            sed -i "/^${key}=/d" "$DEFCONFIG_PATH"
            echo "# ${key} is not set" >> "$DEFCONFIG_PATH"
          }

          set_cfg CONFIG_KSU y
          set_cfg CONFIG_KSU_MANUAL_HOOK y
          # Manual hooks + kprobes enabled at the same time is what causes the
          # boot loops reported for 5.4-class kernels — keep kprobes off.
          unset_cfg CONFIG_KPROBES
          unset_cfg CONFIG_KPROBE_EVENTS
          unset_cfg CONFIG_HAVE_KPROBES

          echo "---- diff ----"
          diff -u "$DEFCONFIG_PATH.bak" "$DEFCONFIG_PATH" || true

      - name: Build wifi/network drivers as loadable modules (.ko)
        # WHY THIS STEP EXISTS -- "no internet after flashing":
        #
        # Log evidence from prior runs: cnss2, cnss_utils, cnss_genl,
        # cnss_prealloc, icnss2 and the whole qcacld-3.0 wifi stack all get
        # linked straight into vmlinux ("AR drivers/net/wireless/cnss2/built-in.a",
        # "AR drivers/built-in.a", ...) instead of being built as "LD [M] cnss2.ko"
        # etc. That means CONFIG_CNSS2 (and friends) are "y" in this defconfig,
        # not "m".
        #
        # This matters because the AnyKernel3 packaging this repo's build.sh
        # already does is module-aware: the "Package AnyKernel3 zip" step log
        # shows it creating modules/system/lib/modules/ inside the flashed zip
        # on every run -- it's ready to ship .ko files -- but that folder comes
        # out empty, because there are simply no .ko files anywhere in the
        # build output to put there. The vendor userspace / wifi HAL on this
        # device expects to insmod a wifi module at boot from that path; with
        # nothing there, wifi (and by extension mobile-data-over-wifi-tethering
        # setups, or just wifi itself) never comes up, even though the kernel
        # boots fine, which matches "flasho e fica sem internet".
        #
        # Fix: read the actual CONFIG_* symbol names straight out of this
        # tree's own Kbuild files for the wifi/cellular driver directories
        # (data-driven, not a hardcoded guess at symbol names that might not
        # match this tree), and flip any of them that are currently "y" to "m"
        # in the defconfig before the build runs.
        run: |
          set -e
          DEFCONFIG_PATH="${{ steps.discover.outputs.defconfig_path }}"
          cp "$DEFCONFIG_PATH" "$DEFCONFIG_PATH.premod.bak"

          WIFI_DIRS="drivers/net/wireless/cnss2 drivers/net/wireless/cnss_genl drivers/net/wireless/cnss_prealloc drivers/net/wireless/cnss_utils drivers/soc/qcom/icnss2 drivers/staging/qcacld-3.0 drivers/staging/qca-wifi-host-cmn"

          # Same version-magic problem hits the FM radio driver (see the
          # "Ensure Wi-Fi / FM radio driver source is actually present" step
          # earlier in this job) -- fold it into the same =y -> =m conversion
          # so it also comes out as a .ko matching this build's vermagic,
          # instead of relying on the mismatched vendor-partition blob.
          for fm_candidate in drivers/media/radio/radio-i2c-rtc6226-qca drivers/media/radio/rtc6226 drivers/staging/radio-rtc6226; do
            [ -d "$fm_candidate" ] && WIFI_DIRS="$WIFI_DIRS $fm_candidate"
          done

          # CONFIG_ICNSS2 is excluded from conversion: building it as a
          # loadable module fails at modpost with
          #   ERROR: "__tracepoint_pil_restart_level" [drivers/soc/qcom/icnss2/icnss2.ko] undefined!
          # because this tree defines that tracepoint in code that stays
          # built into vmlinux and never exports it for module use (no
          # EXPORT_TRACEPOINT_SYMBOL for pil_restart_level), so nothing
          # outside vmlinux can resolve it. Every other CONFIG_* below
          # (cnss2, cnss_genl, cnss_prealloc, cnss_utils, qcacld-3.0, ...)
          # links fine as a module -- only icnss2 hits this, so it's the
          # one left "=y" until the tracepoint export is fixed upstream.
          EXCLUDE_SYMS="CONFIG_ICNSS2"

          SYMBOLS=""
          for d in $WIFI_DIRS; do
            [ -d "$d" ] || continue
            SYMS=$(grep -rhoE 'obj-\$\(CONFIG_[A-Z0-9_]+\)' "$d" 2>/dev/null | sed -E 's/obj-\$\(([A-Z0-9_]+)\)/\1/' | sort -u)
            SYMBOLS="${SYMBOLS}"$'\n'"${SYMS}"
          done
          SYMBOLS=$(echo "$SYMBOLS" | tr ' ' '\n' | sort -u | grep -v '^$' || true)

          {
            echo "## Wifi/network module conversion"
            echo
            echo "CONFIG_* symbols discovered under: \`$WIFI_DIRS\`"
            echo '```'
            echo "$SYMBOLS"
            echo '```'
            echo
            echo "Excluded from conversion (kept built-in): \`$EXCLUDE_SYMS\` -- see step source for why."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "== Wifi/cellular CONFIG symbols found in tree =="
          echo "$SYMBOLS"

          CHANGED=""
          for sym in $SYMBOLS; do
            case " $EXCLUDE_SYMS " in
              *" $sym "*) continue ;;
            esac
            if grep -qE "^${sym}=y\$" "$DEFCONFIG_PATH"; then
              sed -i "s/^${sym}=y\$/${sym}=m/" "$DEFCONFIG_PATH"
              CHANGED="$CHANGED $sym"
            fi
          done

          # CONFIG_MODULES itself has to be on, or every "=m" above silently
          # collapses back to built-in (or drops out entirely) at oldconfig time.
          if ! grep -q '^CONFIG_MODULES=y' "$DEFCONFIG_PATH"; then
            sed -i '/^# CONFIG_MODULES is not set/d; /^CONFIG_MODULES=/d' "$DEFCONFIG_PATH"
            echo "CONFIG_MODULES=y" >> "$DEFCONFIG_PATH"
            CHANGED="$CHANGED CONFIG_MODULES"
          fi

          if [ -z "$CHANGED" ]; then
            echo "::warning::No wifi/network CONFIG_* symbols were flipped from y to m. Either they're already '=m' (in which case the 'no internet' issue is elsewhere -- check patch-report.txt / device logcat instead), or the WIFI_DIRS list in this step doesn't match this tree's actual driver layout. Check the symbol list in this run's Summary tab -- if it's empty, the driver directories moved and this step's WIFI_DIRS needs updating to match."
          else
            echo "Flipped to =m:$CHANGED"
          fi

          echo "---- diff ----"
          diff -u "$DEFCONFIG_PATH.premod.bak" "$DEFCONFIG_PATH" || true

      - name: Auto-patch manual KernelSU-Next hooks
        run: |
          set -e
          cat > /tmp/apply_ksu_hooks.py <<'PYEOF'
          import re, sys, pathlib

          REPORT = []

          def patch_file(path, marker, anchor_regex, extern_block, call_block, insert_mode="after_anchor_line"):
              p = pathlib.Path(path)
              if not p.exists():
                  REPORT.append(f"SKIP  {path}: file not found")
                  return
              text = p.read_text()
              if marker in text:
                  REPORT.append(f"SKIP  {path}: already patched")
                  return

              m = re.search(anchor_regex, text)
              if not m:
                  REPORT.append(f"FAIL  {path}: anchor pattern not found, needs manual hook -> {anchor_regex}")
                  return

              if insert_mode == "before_line":
                  # anchor_regex is expected to end at the opening brace "{" of the
                  # function body. Insert the extern block before the line containing
                  # the match, and the call block right after that "{".
                  line_start = text.rfind("\n", 0, m.start()) + 1
                  new_text = text[:line_start] + extern_block + text[line_start:]
                  m2 = re.search(anchor_regex, new_text)
                  insert_at = m2.end()
                  new_text = new_text[:insert_at] + "\n" + call_block + new_text[insert_at:]
              elif insert_mode == "after_anchor_line":
                  # anchor_regex is expected to match the whole anchor line, including
                  # its trailing newline. Insert extern block before that line and the
                  # call block right after it.
                  line_start = text.rfind("\n", 0, m.start()) + 1
                  line_end = m.end()
                  new_text = text[:line_start] + extern_block + text[line_start:line_end] + call_block + text[line_end:]
              else:
                  REPORT.append(f"FAIL  {path}: unknown insert_mode")
                  return

              p.write_text(new_text)
              REPORT.append(f"OK    {path}: hook inserted")


          # These five hooks are the current official set required by
          # KernelSU-Next's non-GKI / manual-hook guide:
          # https://kernelsu-next.github.io/webpage/pages/how-to-integrate-for-non-gki.html
          # (drivers/kernelsu/Kbuild's "No hooks were defined" check is looking
          # for evidence of exactly these call sites.)

          # 1. fs/exec.c -- do_execve() hook (extern + call).
          #
          # Some kernel trees (this one included) already ship a partial or
          # full manual hook in fs/exec.c out of the box. Patching the extern
          # and the call as two independently-marked blocks is what bit us
          # last time: the extern's marker matched pre-existing text and was
          # correctly skipped, but the call's marker ("ksu_handle_execveat(
          # (int *)AT_FDCWD") did NOT match the tree's own differently
          # formatted call site, so we blindly inserted a second call --
          # anchored on a line that, in this tree, turned out to belong to a
          # different helper without a `filename` local in scope, causing:
          #   fs/exec.c:1921:40: error: use of undeclared identifier 'filename'
          #
          # Fix: detect ANY existing call site generically (not just our own
          # exact text) and skip the whole file if one is already there,
          # instead of risking a duplicate/misplaced insertion.
          _p = pathlib.Path("fs/exec.c")
          if not _p.exists():
              REPORT.append("SKIP  fs/exec.c: file not found")
          else:
              _text = _p.read_text()
              _has_extern = "extern int ksu_handle_execveat" in _text
              # A call looks like `ksu_handle_execveat(<arg>, ...)` where <arg>
              # is NOT "int *fd" (that prefix only ever appears in the extern
              # declaration's own parameter list).
              _has_call = re.search(r"ksu_handle_execveat\((?!int \*fd)", _text) is not None

              if _has_call:
                  REPORT.append(
                      "SKIP  fs/exec.c: an existing ksu_handle_execveat call site was "
                      "found in this tree already -- leaving it alone rather than risk "
                      "a duplicate/misplaced insertion. If execve hooking doesn't work "
                      "at runtime, check this call site by hand."
                  )
              else:
                  if not _has_extern:
                      m = re.search(r"(?s:int do_execve\(struct filename \*filename,.*?\)\s*\n\{)", _text)
                      if not m:
                          REPORT.append("FAIL  fs/exec.c: do_execve() signature not found, needs manual hook")
                          _text = None
                      else:
                          line_start = _text.rfind("\n", 0, m.start()) + 1
                          extern_block = (
                              "#ifdef CONFIG_KSU\n"
                              "__attribute__((hot))\n"
                              "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
                              "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
                              "#endif\n\n"
                          )
                          _text = _text[:line_start] + extern_block + _text[line_start:]

                  if _text is not None:
                      m = re.search(r"[ \t]*struct user_arg_ptr envp = \{ \.ptr\.native = __envp \};\n", _text)
                      if not m:
                          REPORT.append("FAIL  fs/exec.c: do_execve() argv/envp locals not found, needs manual hook")
                      else:
                          call_block = (
                              "#ifdef CONFIG_KSU\n"
                              "\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n"
                              "#endif\n"
                          )
                          insert_at = m.end()
                          _text = _text[:insert_at] + call_block + _text[insert_at:]

                          # Optional: compat_do_execve() (32-bit ABI). Best-effort --
                          # many trees don't build this path with CONFIG_COMPAT off.
                          m2 = re.search(r"[ \t]*\.ptr\.compat = __envp,\n[ \t]*\};\n", _text)
                          if m2:
                              compat_call = (
                                  "#ifdef CONFIG_KSU // 32-bit ksud and 32-on-64 support\n"
                                  "\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n"
                                  "#endif\n"
                              )
                              _text = _text[:m2.end()] + compat_call + _text[m2.end():]

                          _p.write_text(_text)
                          REPORT.append("OK    fs/exec.c: hook inserted")


          # 2. fs/open.c -- faccessat hook
          patch_file(
              "fs/open.c",
              marker="ksu_handle_faccessat",
              anchor_regex=r"SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)\s*\n\{",
              extern_block=(
                  "#ifdef CONFIG_KSU\n"
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
                  "\t\t\t\tint *mode, int *flags);\n"
                  "#endif\n\n"
              ),
              call_block=(
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                  "#endif\n\n"
              ),
              insert_mode="before_line",
          )

          # 3. fs/read_write.c -- su compat for `read` syscall, anchored on
          #    SYSCALL_DEFINE3(read...) itself (not vfs_read -- older/wrong
          #    anchor is what caused the "No hooks were defined" failure).
          patch_file(
              "fs/read_write.c",
              marker="ksu_handle_sys_read",
              anchor_regex=r"SYSCALL_DEFINE3\(read, unsigned int, fd, char __user \*, buf, size_t, count\)\s*\n\{",
              extern_block=(
                  "#ifdef CONFIG_KSU\n"
                  "extern bool ksu_vfs_read_hook __read_mostly;\n"
                  "extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,\n"
                  "\t\t\t\tchar __user **buf_ptr, size_t *count_ptr);\n"
                  "#endif\n\n"
              ),
              call_block=(
                  "#ifdef CONFIG_KSU\n"
                  "\tif (unlikely(ksu_vfs_read_hook))\n"
                  "\t\tksu_handle_sys_read(fd, &buf, &count);\n"
                  "#endif\n"
              ),
              insert_mode="before_line",
          )

          # 4. fs/stat.c -- newfstatat hook (su path spoofing under sucompat)
          patch_file(
              "fs/stat.c",
              marker="ksu_handle_stat",
              anchor_regex=r"(?s:SYSCALL_DEFINE4\(newfstatat, int, dfd, const char __user \*, filename,.*?struct stat __user \*, statbuf, int, flag\)\s*\n\{)",
              extern_block=(
                  "#ifdef CONFIG_KSU\n"
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n"
                  "\t\t\t\tint *flags);\n"
                  "#endif\n\n"
              ),
              call_block=(
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_stat(&dfd, &filename, &flag);\n"
                  "#endif\n"
              ),
              insert_mode="before_line",
          )

          # 5. kernel/reboot.c -- reboot hook (module umount / safe teardown)
          patch_file(
              "kernel/reboot.c",
              marker="ksu_handle_sys_reboot",
              anchor_regex=r"(?s:SYSCALL_DEFINE4\(reboot, int, magic1, int, magic2, unsigned int, cmd,.*?void __user \*, arg\)\s*\n\{)",
              extern_block=(
                  "#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                  "#endif\n\n"
              ),
              call_block=(
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                  "#endif\n"
              ),
              insert_mode="before_line",
          )

          report_path = "/tmp/patch-report.txt"
          pathlib.Path(report_path).write_text("\n".join(REPORT) + "\n")
          print("\n".join(REPORT))

          failures = [r for r in REPORT if r.startswith("FAIL")]
          if failures:
              print("\n::warning::Some hooks could not be auto-patched -- apply them manually, see patch-report.txt")

          PYEOF
          python3 /tmp/apply_ksu_hooks.py
          cp /tmp/patch-report.txt patch-report.txt

      - name: Backport path_umount to fs/namespace.c (pre-5.9 kernels)
        # Fixes: "ld.lld: error: undefined symbol: path_umount" during the
        # final link.
        #
        # KernelSU-Next's own Kbuild logic (see the "-- KSU_NEXT: adding
        # function ... to ../fs/namespace.c" lines in the build log) only
        # ever inserts a forward *declaration* of path_umount()/can_umount()
        # when it can't find them already defined -- it never adds the
        # actual function bodies. On any kernel older than 5.9 (path_umount
        # was only introduced upstream in 5.9), that leaves drivers/kernelsu
        # calling a symbol that is declared but never implemented, which
        # compiles fine and then fails at the vmlinux link step.
        #
        # This step applies the official backport from the KernelSU non-GKI
        # guide (https://kernelsu.org/guide/how-to-integrate-for-non-gki.html
        # -> "How to backport path_umount") *before* the build runs, so that
        # by the time KernelSU-Next's Kbuild scans fs/namespace.c it finds a
        # real implementation already there and skips its own declaration-only
        # patch instead of leaving a dangling symbol.
        run: |
          set -e
          cat > /tmp/backport_path_umount.py <<'PYEOF'
          import re, pathlib, sys

          REPORT = []
          p = pathlib.Path("fs/namespace.c")

          if not p.exists():
              REPORT.append("SKIP  fs/namespace.c: file not found")
          else:
              text = p.read_text()

              if re.search(r"\bint\s+path_umount\s*\(\s*struct path\s*\*\s*path\s*,\s*int\s+flags\s*\)\s*\n?\s*\{", text):
                  REPORT.append("SKIP  fs/namespace.c: path_umount already implemented")
              else:
                  # Anchor on the umount(2) syscall definition, which is present
                  # (in some form) in every namespace.c that implements umount.
                  # The backport is inserted immediately before it, matching the
                  # placement used by the upstream 5.9 patch this is lifted from.
                  anchor_re = re.compile(
                      r"[ \t]*SYSCALL_DEFINE2\(umount,\s*char __user \*,\s*name,\s*int,\s*flags\)\s*\n\{"
                  )
                  m = anchor_re.search(text)
                  if not m:
                      REPORT.append(
                          "FAIL  fs/namespace.c: SYSCALL_DEFINE2(umount...) anchor not found -- "
                          "backport path_umount by hand, see "
                          "https://kernelsu.org/guide/how-to-integrate-for-non-gki.html#how-to-backport-path-umount"
                      )
                  else:
                      line_start = text.rfind("\n", 0, m.start()) + 1
                      backport = (
                          "static int can_umount(const struct path *path, int flags)\n"
                          "{\n"
                          "\tstruct mount *mnt = real_mount(path->mnt);\n"
                          "\n"
                          "\tif (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))\n"
                          "\t\treturn -EINVAL;\n"
                          "\tif (!may_mount())\n"
                          "\t\treturn -EPERM;\n"
                          "\tif (path->dentry != path->mnt->mnt_root)\n"
                          "\t\treturn -EINVAL;\n"
                          "\tif (!check_mnt(mnt))\n"
                          "\t\treturn -EINVAL;\n"
                          "\tif (mnt->mnt.mnt_flags & MNT_LOCKED) /* Check optimistically */\n"
                          "\t\treturn -EINVAL;\n"
                          "\tif (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))\n"
                          "\t\treturn -EPERM;\n"
                          "\treturn 0;\n"
                          "}\n"
                          "\n"
                          "int path_umount(struct path *path, int flags)\n"
                          "{\n"
                          "\tstruct mount *mnt = real_mount(path->mnt);\n"
                          "\tint ret;\n"
                          "\n"
                          "\tret = can_umount(path, flags);\n"
                          "\tif (!ret)\n"
                          "\t\tret = do_umount(mnt, flags);\n"
                          "\n"
                          "\t/* we mustn't call path_put() as that would clear mnt_expiry_mark */\n"
                          "\tdput(path->dentry);\n"
                          "\tmntput_no_expire(mnt);\n"
                          "\treturn ret;\n"
                          "}\n"
                          "\n"
                      )
                      new_text = text[:line_start] + backport + text[line_start:]
                      p.write_text(new_text)
                      REPORT.append("OK    fs/namespace.c: path_umount/can_umount backport inserted")

          print("\n".join(REPORT))
          with open("patch-report.txt", "a") as f:
              f.write("\n".join(REPORT) + "\n")

          if any(r.startswith("FAIL") for r in REPORT):
              print("::warning::path_umount backport could not be auto-applied -- apply it manually, see patch-report.txt")
          PYEOF
          python3 /tmp/backport_path_umount.py

      - name: Remaining manual hooks (informational)
        run: |
          cat <<'EOF'
          This workflow now auto-patches all five hooks required by the
          current official KernelSU-Next non-GKI guide, plus the
          path_umount backport:
            1. fs/exec.c        -> do_execve / ksu_handle_execveat
            2. fs/open.c        -> faccessat  / ksu_handle_faccessat
            3. fs/read_write.c  -> read       / ksu_handle_sys_read
            4. fs/stat.c        -> newfstatat / ksu_handle_stat
            5. kernel/reboot.c  -> reboot     / ksu_handle_sys_reboot
            6. fs/namespace.c   -> can_umount/path_umount backport, needed
               on any tree older than 5.9 for the KernelSU "module umount"
               feature (this is also what fixes the
               "ld.lld: error: undefined symbol: path_umount" link failure).

          These are anchor/regex based, so they are only as good as the match
          against YOUR tree's exact function signatures -- always check
          patch-report.txt (uploaded as an artifact even on build failure)
          for FAIL lines before assuming a hook actually landed.

          Additionally, patches/susfs_patch_to_5_4.patch (SUSFS) is applied
          right before the build step, via git apply / patch -p1. Same rule
          applies: check patch-report.txt for a FAIL line if you don't see
          CONFIG_KSU_SUSFS behaving as expected.

          See: https://kernelsu-next.github.io/webpage/pages/how-to-integrate-for-non-gki.html
          EOF

      - name: Apply SUSFS patch (patches/susfs_patch_to_5_4.patch)
        # Applies the SUSFS (Simple Universal Sus-Free System) patch that must
        # ship inside the repo at patches/susfs_patch_to_5_4.patch. This adds
        # fs/susfs.c plus the CONFIG_KSU_SUSFS* hooks into fs/namei.c,
        # fs/Makefile, etc. It has to run before "Build kernel" so the new
        # files/hooks are present when Kconfig/Makefile are evaluated.
        #
        # Tries `git apply` first (tolerates whitespace drift better and
        # gives a clean dry-run check via --check), then falls back to
        # classic `patch -p1` for repos where the tree isn't a plain git
        # checkout state the patch expects. Non-fatal on failure -- like the
        # other auto-patch steps in this workflow, it logs to
        # patch-report.txt and emits a ::warning:: instead of killing the
        # whole job, since a bad match here doesn't necessarily mean the
        # kernel itself won't compile (only that SUSFS won't be present).
        run: |
          set -e
          PATCH_FILE="patches/susfs_patch_to_5_4.patch"

          # ---- Diagnostics: printed on every run, not just on failure, so ----
          # ---- the next run's log tells us exactly *why* the file is/isn't ----
          # ---- where we expect it, instead of just "not found".           ----
          echo "== SUSFS patch diagnostics =="
          echo "-- patches/ directory as checked out --"
          ls -la patches 2>/dev/null || echo "(no patches/ directory at all in this checkout)"
          echo "-- files git actually tracks with 'susfs' in the name, on this ref --"
          git ls-files | grep -i susfs || echo "(git tracks no file with 'susfs' in its name on $(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo this ref))"
          echo "-- any *.patch file anywhere in the tree (tracked or not) --"
          find . -maxdepth 4 -iname '*.patch' -not -path './proton-clang/*' -not -path './.git/*' 2>/dev/null || true
          echo "-- .gitignore rules that could be hiding a patches/ file --"
          { [ -f .gitignore ] && grep -nE 'patch' .gitignore; } || echo "(no matching .gitignore rule)"

          if [ ! -f "$PATCH_FILE" ]; then
            # Fall back to searching the whole tree for a plausibly-named
            # susfs patch before giving up -- handles it being committed
            # under different case, extension, or a different subfolder than
            # exactly "patches/susfs_patch_to_5_4.patch".
            FOUND=$(find . -maxdepth 4 \( -iname 'susfs*patch*' -o -iname '*susfs*.patch' -o -iname '*susfs*.diff' \) -not -path './proton-clang/*' -not -path './.git/*' 2>/dev/null | head -n1 || true)
            if [ -n "$FOUND" ]; then
              echo "\"$PATCH_FILE\" not found, but a likely match was found elsewhere in the tree: $FOUND -- using that instead."
              PATCH_FILE="$FOUND"
            fi
          fi

          if [ ! -f "$PATCH_FILE" ]; then
            echo "::warning::SUSFS patch not applied -- no susfs patch file was found anywhere in the checked-out tree (see the diagnostics printed earlier in this step's log). The three most likely causes: (1) the file exists on your machine but was never actually 'git add'ed/committed/pushed to the topaz-rebase branch -- run 'git status' and 'git log --oneline -- patches/' locally to confirm; (2) it's excluded by a .gitignore rule matching *.patch or patches/ -- if so, force-add it with 'git add -f patches/susfs_patch_to_5_4.patch'; (3) it was committed to a different branch than the one this workflow builds (topaz-rebase). Once you confirm which it is, re-run -- no code change to this workflow is needed if the fix is on the repo side."
            echo "SKIP  $PATCH_FILE: file not found in repo" >> patch-report.txt
            exit 0
          fi

          if git apply --check "$PATCH_FILE" 2>/tmp/susfs_git_apply_check.log; then
            git apply "$PATCH_FILE"
            echo "OK    $PATCH_FILE: applied cleanly via git apply" | tee -a patch-report.txt
          elif patch -p1 --dry-run -f < "$PATCH_FILE" >/tmp/susfs_patch_dryrun.log 2>&1; then
            patch -p1 -f < "$PATCH_FILE"
            echo "OK    $PATCH_FILE: applied cleanly via patch -p1 (git apply --check failed, see log below)" | tee -a patch-report.txt
            cat /tmp/susfs_git_apply_check.log
          else
            echo "::warning::SUSFS patch did not apply cleanly -- the tree's fs/namei.c, fs/Makefile, etc. may already differ from what patches/susfs_patch_to_5_4.patch expects (already-patched tree, wrong kernel version/branch, or upstream drift). Build will continue without SUSFS. See patch-report.txt and the step log for the git apply / patch rejection details."
            {
              echo "FAIL  $PATCH_FILE: did not apply via git apply or patch -p1"
              echo "--- git apply --check output ---"
              cat /tmp/susfs_git_apply_check.log
              echo "--- patch -p1 --dry-run output ---"
              cat /tmp/susfs_patch_dryrun.log
            } >> patch-report.txt
          fi

      - name: Full clean (mrproper, stale out/, stale modules)
        run: |
          set -e
          ARCH="${{ github.event.inputs.arch || 'arm64' }}"

          echo "== Pre-clean state =="
          echo "out/ present: $([ -d out ] && echo yes || echo no)"
          find . -maxdepth 3 -iname "*.ko" -not -path "./proton-clang/*" 2>/dev/null | head -n 20 || true

          if [ -f Makefile ]; then
            echo "==> make ARCH=$ARCH O=out mrproper"
            make ARCH="$ARCH" O=out mrproper || echo "::warning::mrproper exited non-zero (often harmless on a fresh checkout with no prior out/) -- continuing with the hard rm -rf backstop below."
          fi

          echo "==> rm -rf out (hard backstop)"
          rm -rf out
          mkdir -p out

          echo "==> Removing any stray *.ko / Module.symvers left in the source tree"
          find . -maxdepth 6 -iname "*.ko" -not -path "./proton-clang/*" -not -path "./out/*" -delete 2>/dev/null || true
          find . -maxdepth 6 -iname "Module.symvers" -not -path "./proton-clang/*" -not -path "./out/*" -delete 2>/dev/null || true

          echo "== Post-clean state =="
          echo "Remaining .ko anywhere in tree (should be empty):"
          find . -iname "*.ko" -not -path "./proton-clang/*" 2>/dev/null || true

          {
            echo "## Full clean performed"
            echo
            echo "\`make mrproper\` + \`rm -rf out\` + stray \`.ko\`/\`Module.symvers\` sweep ran before this build. Any module you see in this run's artifacts was compiled fresh, in this job, against this commit -- not carried over from a previous run or a different Atom/Topaz commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build kernel
        timeout-minutes: 120
        run: |
          set -e
          set -o pipefail
          ARCH="${{ github.event.inputs.arch || 'arm64' }}"
          DEFCONFIG_PATH="${{ steps.discover.outputs.defconfig_path }}"
          DEFCONFIG_NAME="$(basename "$DEFCONFIG_PATH" _defconfig)"
          HAS_GENERATE_DEFCONFIG="${{ steps.discover.outputs.has_generate_defconfig }}"
          BUILD_CONFIG="${{ github.event.inputs.build_config }}"
          if [ -z "$BUILD_CONFIG" ]; then
            BUILD_CONFIG="${{ steps.discover.outputs.build_config }}"
          fi

          # Figure out the defconfig argument the way `make` expects it,
          # i.e. relative to arch/$ARCH/configs, e.g. "vendor/dubai-qgki_defconfig".
          DEFCONFIG_ARG="${DEFCONFIG_PATH#arch/$ARCH/configs/}"

          # LLVM=1/LLVM_IAS=1 force the ENTIRE toolchain (cc, ld, ar, nm,
          # objcopy, objdump, strip) through clang/lld -- no mixed GNU
          # binutils. This is the "compilação com LLVM=1" requirement, and it
          # also keeps vermagic/modversions stable build-to-build.
          MAKE_TOOLCHAIN_ARGS=(
            "LLVM=1" "LLVM_IAS=1"
            "CC=$CC"
            "CROSS_COMPILE=$CROSS_COMPILE"
            "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
            "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT"
            "AR=$AR" "NM=$NM" "OBJCOPY=$OBJCOPY" "OBJDUMP=$OBJDUMP" "STRIP=$STRIP" "LD=$LD"
          )

          if [ -f build.sh ]; then
            chmod +x build.sh
          fi

          echo "== Toolchain summary for this build =="
          echo "LLVM=1 LLVM_IAS=1  CC=$CC  CROSS_COMPILE=$CROSS_COMPILE  LD=$LD"
          clang --version || true

          if [ -n "$BUILD_CONFIG" ] && [ -x build.sh ]; then
            echo "==> Building via build.sh with BUILD_CONFIG=$BUILD_CONFIG LLVM=1 (this script also packages the AnyKernel3 zip)"
            BUILD_CONFIG="$BUILD_CONFIG" LLVM=1 LLVM_IAS=1 ./build.sh 2>&1 | tee /tmp/build.log
            grep -E "error:|Error [0-9]+" /tmp/build.log > /tmp/build-errors.log || true
          else
            echo "==> No usable build.sh/build.config pair — using plain make with $DEFCONFIG_ARG"
            echo "::warning::Falling back to plain make. This will only produce a raw Image, not a flashable AnyKernel3 zip — the dedicated 'Package AnyKernel3 zip' step later in this job will handle that instead."
            if [ "$HAS_GENERATE_DEFCONFIG" = "true" ]; then
              echo "Running scripts/gki/generate_defconfig.sh to merge QGKI fragments first"
              ARCH="$ARCH" scripts/gki/generate_defconfig.sh "$DEFCONFIG_ARG" || \
                echo "::warning::generate_defconfig.sh failed or isn't needed for this tree — continuing with make directly"
            fi
            make ARCH="$ARCH" O=out "${MAKE_TOOLCHAIN_ARGS[@]}" "$DEFCONFIG_ARG"
            make ARCH="$ARCH" O=out "${MAKE_TOOLCHAIN_ARGS[@]}" -j"$(nproc)" 2>&1 | tee /tmp/build.log
            grep -E "error:|Error [0-9]+" /tmp/build.log > /tmp/build-errors.log || true
          fi

          if [ -s /tmp/build-errors.log ]; then
            {
              echo "## ⚠️ Compiler/linker error lines detected in build log"
              echo '```'
              cat /tmp/build-errors.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "==> Build step finished. Checking for a kernel Image..."
          IMAGE_PATH=$(find out/arch/"$ARCH"/boot -maxdepth 1 -iname "Image*" 2>/dev/null | head -n1 || true)
          if [ -z "$IMAGE_PATH" ]; then
            # build.sh (when used) may keep the Image somewhere other than
            # out/arch/$ARCH/boot and package its own flashable zip straight
            # into $GITHUB_WORKSPACE instead. That's still a successful
            # build — only treat this as a real failure if build.sh (or
            # plain make) *also* failed to leave a zip we can pick up later.
            EXISTING_ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./proton-clang/*" -not -path "./out/*" 2>/dev/null | head -n1 || true)
            if [ -n "$EXISTING_ZIP" ]; then
              echo "::warning::No Image under out/arch/$ARCH/boot, but build.sh already packaged a flashable zip at $EXISTING_ZIP — treating the build as successful. (If your build.sh uses a custom OUT_DIR, consider exporting OUT_DIR=out so future steps can also see the raw Image/dtb/dtbo.)"
            else
              echo "::error::No Image was produced under out/arch/$ARCH/boot after the build step, and no flashable zip was found anywhere else in the workspace either. The compile did not actually finish successfully — scroll up in this same step's log for the first real compiler/linker error (search for 'error:' or 'Error 2'), fix it, and re-run. Packaging steps further down cannot do anything without an Image."
              exit 1
            fi
          else
            echo "Found kernel Image at: $IMAGE_PATH"
          fi

      - name: Validate Module.symvers
        # WHY THIS STEP EXISTS:
        #
        # `out/Module.symvers` is what ties every `.ko`'s CRCs/exported
        # symbols back to THIS exact vmlinux build. If it's missing, empty,
        # or clearly stale (older than the modules that supposedly came from
        # this same run), that's a hard signal something upstream reused a
        # cached/partial build instead of the one this job just compiled --
        # the same class of bug that produces "wrong .ko from another
        # commit". Fail loudly here, before packaging spends any more time
        # on output that can't be trusted.
        if: always()
        run: |
          set -e
          ARCH="${{ github.event.inputs.arch || 'arm64' }}"
          SYMVERS="out/Module.symvers"

          if [ ! -f "$SYMVERS" ]; then
            KO_COUNT=$(find out -iname "*.ko" 2>/dev/null | wc -l)
            if [ "$KO_COUNT" -gt 0 ]; then
              echo "::error::out/Module.symvers is missing but $KO_COUNT .ko file(s) were produced -- these modules cannot be trusted to match this build and must not be shipped."
              exit 1
            else
              echo "::warning::out/Module.symvers not found and no .ko files were built either -- fine if this defconfig has no loadable modules, otherwise check the build log."
              exit 0
            fi
          fi

          LINES=$(wc -l < "$SYMVERS" | tr -d ' ')
          if [ "$LINES" -eq 0 ]; then
            echo "::error::out/Module.symvers exists but is EMPTY (0 symbol lines) — no module in this build can be trusted to have valid CRCs/exports. Failing."
            exit 1
          fi

          # Newer than the vmlinux it describes? If not, it's leftover from a
          # previous config/compile pass that the "Full clean" step should
          # have removed -- treat this as a build hygiene failure.
          if [ -f out/vmlinux ] && [ out/vmlinux -nt "$SYMVERS" ]; then
            echo "::error::out/vmlinux is newer than out/Module.symvers — Module.symvers appears to be stale (from an earlier pass), not from this final link. Failing rather than shipping modules that may not match."
            exit 1
          fi

          echo "OK: out/Module.symvers present, $LINES symbol entries, newer than/matching this build's vmlinux."
          {
            echo "## Module.symvers validation"
            echo
            echo "✅ \`out/Module.symvers\` present — $LINES exported-symbol entries, timestamped after \`vmlinux\` (i.e. produced by THIS build's final link)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify vermagic (fail on mismatch — blocks foreign/stale .ko)
        # WHY THIS STEP EXISTS -- this is the core fix for
        # "mandando os .ko errados de outro commit do atom":
        #
        # Every .ko file embeds a `vermagic=<UTS_RELEASE> <SMP/PREEMPT flags>
        # <arch>` string in its .modinfo section (this is what insmod/modprobe
        # check against the running kernel's own vermagic before allowing a
        # module to load). If a `.ko` sitting in this run's `out/` tree was
        # actually left over from a different commit/build (stale cache,
        # copy-paste from another Atom branch, a prebuilt blob accidentally
        # dropped into the tree, etc.), its vermagic string will NOT match
        # this build's own UTS_RELEASE — that mismatch is detectable
        # mechanically, so we check it here instead of trusting the file
        # timestamps/paths.
        #
        # This step FAILS THE JOB (not just a warning) on any mismatch, so a
        # bad module can never silently make it into the uploaded artifacts.
        if: always()
        run: |
          set -e
          ARCH="${{ github.event.inputs.arch || 'arm64' }}"

          UTSRELEASE_FILE="out/include/generated/utsrelease.h"
          if [ ! -f "$UTSRELEASE_FILE" ]; then
            echo "::error::$UTSRELEASE_FILE not found — the build did not get far enough to generate a kernel release string, so vermagic cannot be verified. Check the 'Build kernel' step log."
            exit 1
          fi
          UTSRELEASE=$(grep -oP '(?<=UTS_RELEASE ")[^"]+' "$UTSRELEASE_FILE")
          if [ -z "$UTSRELEASE" ]; then
            echo "::error::Could not parse UTS_RELEASE out of $UTSRELEASE_FILE — printing its contents for debugging:"
            cat "$UTSRELEASE_FILE"
            exit 1
          fi
          echo "This build's kernel release (UTS_RELEASE): $UTSRELEASE"

          KO_FILES=$(find out -iname "*.ko" 2>/dev/null || true)
          if [ -z "$KO_FILES" ]; then
            echo "::warning::No .ko files found under out/ — nothing to vermagic-check. Fine if this defconfig builds no loadable modules; otherwise check the 'Build wifi/network drivers as loadable modules' step."
            {
              echo "## Vermagic verification"
              echo
              echo "Kernel release: \`$UTSRELEASE\`. No \`.ko\` files were produced, so there was nothing to check."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          FAIL=0
          REPORT="/tmp/vermagic-report.txt"
          {
            echo "Kernel release (this build): $UTSRELEASE"
            echo "----"
          } > "$REPORT"

          for ko in $KO_FILES; do
            VM=$(strings "$ko" 2>/dev/null | grep -m1 '^vermagic=' || true)
            if [ -z "$VM" ]; then
              echo "::error::$ko has NO vermagic string at all — corrupt, stripped-too-hard, or not actually a kernel module built by this tree. Not safe to ship."
              echo "FAIL  $ko  (no vermagic string found)" >> "$REPORT"
              FAIL=1
              continue
            fi
            if echo "$VM" | grep -q "^vermagic=${UTSRELEASE} "; then
              echo "OK    $ko  -> $VM"
              echo "OK    $ko  -> $VM" >> "$REPORT"
            else
              echo "::error::VERMAGIC MISMATCH in $ko — found '$VM', expected release '$UTSRELEASE'. This module was built for a DIFFERENT commit/kernel and will NOT load (or worse, will silently corrupt state) if flashed. Refusing to package it."
              echo "FAIL  $ko  -> $VM  (expected vermagic=${UTSRELEASE} ...)" >> "$REPORT"
              FAIL=1
            fi
          done

          cp "$REPORT" vermagic-report.txt

          {
            echo "## Vermagic verification"
            echo
            echo "Kernel release: \`$UTSRELEASE\`"
            echo
            echo '```'
            cat "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::One or more .ko files failed vermagic verification — see vermagic-report.txt / the Summary tab. Failing the job so these modules never reach the uploaded artifacts or a flashable zip."
            exit 1
          fi

          echo "All $(echo "$KO_FILES" | wc -l) module(s) match this build's vermagic exactly."

      - name: Package AnyKernel3 zip
        id: anykernel
        if: always()
        run: |
          set -e
          ARCH="${{ github.event.inputs.arch || 'arm64' }}"
          mkdir -p /tmp/anykernel-out

          # If build.sh already produced a flashable zip itself (it does its
          # own AnyKernel3 packaging when it runs), just pick that up instead
          # of packaging a second, possibly-conflicting zip. Do this check
          # FIRST, before looking for a raw Image under out/arch/$ARCH/boot —
          # some build.sh variants use a different OUT_DIR internally and
          # never leave the Image there at all, even on a fully successful
          # build, so requiring it here would wrongly skip packaging.
          EXISTING_ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./proton-clang/*" -not -path "./out/*" 2>/dev/null | head -n1 || true)
          if [ -n "$EXISTING_ZIP" ]; then
            echo "build.sh already packaged a flashable zip at: $EXISTING_ZIP"
            cp "$EXISTING_ZIP" /tmp/anykernel-out/
            exit 0
          fi

          if [ ! -f "out/arch/$ARCH/boot/Image" ] && [ ! -f "out/arch/$ARCH/boot/Image.gz" ]; then
            echo "::warning::No Image under out/arch/$ARCH/boot and no zip produced by build.sh either — the build step above must have failed or exited early. Nothing to package."
            exit 0
          fi

          # Otherwise (plain-`make` path), package it ourselves using an
          # AnyKernel3 template already committed in the repo, if there is one.
          AK_DIR=""
          for d in anykernel AnyKernel3 anykernel3 AnyKernel; do
            if [ -f "$d/anykernel.sh" ]; then
              AK_DIR="$d"
              break
            fi
          done

          if [ -z "$AK_DIR" ]; then
            echo "::warning::No AnyKernel3 template (an anykernel.sh) found in this repo, and build.sh didn't package a zip either. Add an AnyKernel3 folder configured for this device (or fix build.sh so its own packaging runs) — uploading the raw Image/dtb/dtbo only for now."
            exit 0
          fi

          echo "Packaging with AnyKernel3 template at: $AK_DIR"
          WORKDIR=$(mktemp -d)
          cp -r "$AK_DIR"/. "$WORKDIR"/
          cp "out/arch/$ARCH/boot/Image" "$WORKDIR"/ 2>/dev/null || cp "out/arch/$ARCH/boot/Image.gz" "$WORKDIR"/ 2>/dev/null || true
          DTB=$(find "out/arch/$ARCH/boot" -maxdepth 1 -iname "*.dtb" 2>/dev/null | head -n1 || true)
          [ -n "$DTB" ] && cp "$DTB" "$WORKDIR/dtb"
          DTBO=$(find "out/arch/$ARCH/boot" -maxdepth 1 -iname "dtbo.img" 2>/dev/null | head -n1 || true)
          [ -n "$DTBO" ] && cp "$DTBO" "$WORKDIR/dtbo.img"

          ZIP_NAME="AtomX-${{ github.event.inputs.defconfig || 'kernel' }}-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::8}.zip"
          ZIP_NAME="${ZIP_NAME//\//-}"
          (cd "$WORKDIR" && zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x ".git*")
          echo "Created $ZIP_NAME"
          cp "$ZIP_NAME" /tmp/anykernel-out/

      - name: Inject compiled Wi-Fi/FM modules into the AnyKernel3 zip
        # WHY THIS STEP EXISTS:
        #
        # build.sh's own AnyKernel3 packaging already creates a
        # modules/.../lib/modules/ folder inside the flashable zip (visible
        # in the "Package AnyKernel3 zip" log), and the anykernel.sh template
        # supports a `do.modules=1` flag that makes AnyKernel3 install
        # whatever .ko files sit in that folder onto the right partition
        # DURING FLASH -- no adb/manual remount needed afterwards. The only
        # thing missing is that build.sh never copies the actual compiled
        # .ko files into that folder. This step does exactly that: reopen
        # the zip this job already produced, drop the freshly-built
        # wifi/FM modules into whichever modules/*/lib/modules/ path the
        # template already has, make sure do.modules is on, and re-zip.
        if: always()
        run: |
          set -e
          ZIP_PATH=$(find /tmp/anykernel-out -maxdepth 1 -iname "*.zip" 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP_PATH" ]; then
            echo "::warning::No AnyKernel3 zip found in /tmp/anykernel-out -- skipping module injection (nothing to inject into)."
            exit 0
          fi

          # The exact set of modules this workflow flips from built-in to
          # loadable, per the "Build wifi/network drivers as loadable
          # modules" step -- keep this list in sync with that step's
          # WIFI_DIRS if you add/remove driver directories there.
          KO_FILES=$(find out -iname "*.ko" \( \
              -iname "wlan.ko" -o \
              -iname "cnss2.ko" -o \
              -iname "cnss_nl.ko" -o \
              -iname "cnss_prealloc.ko" -o \
              -iname "*rtc6226*.ko" \
            \) 2>/dev/null || true)

          if [ -z "$KO_FILES" ]; then
            echo "::warning::None of the expected wifi/FM .ko files were found under out/ -- the version-magic mismatch this workflow exists to fix will NOT be resolved by this zip. Check the 'Build wifi/network drivers as loadable modules' step output."
            exit 0
          fi

          echo "Modules to inject:"
          echo "$KO_FILES"

          WORKDIR=$(mktemp -d)
          unzip -q "$ZIP_PATH" -d "$WORKDIR"

          # Reuse whatever modules/*/lib/modules directory the template
          # already ships (that's the path AnyKernel3's do.modules logic on
          # THIS particular template actually installs from) instead of
          # guessing between modules/system/... and modules/vendor/....
          TARGET_DIRS=$(find "$WORKDIR" -type d -path "*/modules/*/lib/modules" 2>/dev/null || true)
          if [ -z "$TARGET_DIRS" ]; then
            echo "::warning::No modules/*/lib/modules directory found inside the zip template -- creating modules/vendor/lib/modules as a best guess. Verify this matches your device's actual module path (check modules.load in your device tree) before relying on do.modules to install these correctly."
            TARGET_DIRS="$WORKDIR/modules/vendor/lib/modules"
            mkdir -p "$TARGET_DIRS"
          fi

          for d in $TARGET_DIRS; do
            echo "Copying modules into: $d"
            for ko in $KO_FILES; do
              cp "$ko" "$d/"
            done
          done

          # Make sure do.modules is actually turned on -- if the template
          # ships it as 0 or commented out, the modules above get ignored
          # at flash time regardless of being present in the zip.
          AK_SH="$WORKDIR/anykernel.sh"
          if [ -f "$AK_SH" ]; then
            if grep -qE '^\s*do\.modules\s*=' "$AK_SH"; then
              sed -i -E 's/^\s*do\.modules\s*=.*/do.modules=1/' "$AK_SH"
            else
              echo "do.modules=1" >> "$AK_SH"
            fi
            echo "do.modules=1 confirmed in anykernel.sh"
          else
            echo "::warning::No anykernel.sh found inside the zip -- can't confirm do.modules is enabled. The modules were still copied into the zip in case your template handles installation differently."
          fi

          # Re-zip in place, same filename, so every later step (upload,
          # summary, etc.) keeps working against the same path.
          rm -f "$ZIP_PATH"
          (cd "$WORKDIR" && zip -r9 -q "$ZIP_PATH" . -x ".git*")

          {
            echo "## Wi-Fi/FM modules injected into AnyKernel3 zip"
            echo
            echo "Injected into \`$(basename "$ZIP_PATH")\`:"
            echo '```'
            echo "$KO_FILES" | xargs -n1 basename
            echo '```'
            echo
            echo "Target path(s) inside the zip:"
            echo '```'
            echo "$TARGET_DIRS"
            echo '```'
            echo
            echo "\`do.modules=1\` confirmed in anykernel.sh — flashing this zip should install these modules directly, no adb/manual remount needed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package vendor_dlkm / system_dlkm modules (when present)
        # WHY THIS STEP EXISTS -- "empacotamento seguro dos módulos
        # (vendor_dlkm, system_dlkm quando existir)":
        #
        # Only modules that already passed the vermagic check above ever get
        # here (this step runs after "Verify vermagic", which exits 1 and
        # stops the job on any mismatch — so there is no path for a
        # foreign/stale .ko to reach this packaging step). What this step
        # adds is *partition-aware* packaging: it looks for whichever
        # module-load manifest this device tree actually ships (the file
        # that lists which .ko belongs on the vendor_dlkm vs. system_dlkm
        # partition — commonly named `vendor_dlkm.modules.load`,
        # `system_dlkm.modules.load`, or plain `modules.load` under the
        # device/vendor tree or inside `out/`) and sorts the freshly built,
        # vermagic-verified modules into matching staging folders. Building
        # an actual flashable vendor_dlkm.img/system_dlkm.img additionally
        # needs device-specific signing/fs-config inputs (mkuserimg_mke2fs
        # or build_image.py + a board's fs_config/file_contexts) that live
        # in the full Android build tree, not in a bare kernel checkout —
        # this step packages the *modules* safely and clearly reports if an
        # .img couldn't be built for that reason, rather than silently
        # skipping or faking one.
        if: always()
        run: |
          set -e
          mkdir -p /tmp/dlkm-out/vendor_dlkm/lib/modules
          mkdir -p /tmp/dlkm-out/system_dlkm/lib/modules

          ALL_KO=$(find out -iname "*.ko" 2>/dev/null || true)
          if [ -z "$ALL_KO" ]; then
            echo "No .ko files present (build may have failed earlier) — nothing to sort into vendor_dlkm/system_dlkm."
            exit 0
          fi

          # Find a manifest telling us which module belongs on which
          # partition. Search the whole tree (device/vendor dirs vary a lot
          # between trees) plus anything the build itself dropped in out/.
          VENDOR_LIST=$(find . out -maxdepth 6 -iname "vendor_dlkm.modules.load" -not -path "./proton-clang/*" 2>/dev/null | head -n1 || true)
          SYSTEM_LIST=$(find . out -maxdepth 6 -iname "system_dlkm.modules.load" -not -path "./proton-clang/*" 2>/dev/null | head -n1 || true)
          GENERIC_LIST=$(find . out -maxdepth 6 -iname "modules.load" -not -path "./proton-clang/*" 2>/dev/null | head -n1 || true)

          copy_listed() {
            local list="$1" dest="$2"
            [ -f "$list" ] || return 1
            local found=0
            while IFS= read -r modname; do
              [ -z "$modname" ] && continue
              modname=$(basename "$modname")
              MATCH=$(echo "$ALL_KO" | grep -F "/$modname" | head -n1 || true)
              if [ -n "$MATCH" ]; then
                cp "$MATCH" "$dest/"
                found=$((found + 1))
              else
                echo "::warning::$modname is listed in $list but was not found among this build's compiled .ko files."
              fi
            done < "$list"
            echo "$found"
          }

          VENDOR_COUNT=0
          SYSTEM_COUNT=0

          if [ -n "$VENDOR_LIST" ]; then
            echo "Using vendor_dlkm manifest: $VENDOR_LIST"
            VENDOR_COUNT=$(copy_listed "$VENDOR_LIST" /tmp/dlkm-out/vendor_dlkm/lib/modules)
          fi
          if [ -n "$SYSTEM_LIST" ]; then
            echo "Using system_dlkm manifest: $SYSTEM_LIST"
            SYSTEM_COUNT=$(copy_listed "$SYSTEM_LIST" /tmp/dlkm-out/system_dlkm/lib/modules)
          fi

          # No explicit manifest anywhere in the tree: fall back to treating
          # every built module as vendor_dlkm (the far more common placement
          # for wifi/FM/vendor drivers on Qualcomm trees like this one) using
          # a generic modules.load list if one exists, otherwise all of them.
          if [ -z "$VENDOR_LIST" ] && [ -z "$SYSTEM_LIST" ]; then
            if [ -n "$GENERIC_LIST" ]; then
              echo "No vendor_dlkm/system_dlkm-specific manifest found; using generic manifest: $GENERIC_LIST (placing into vendor_dlkm as the default partition for this tree)."
              VENDOR_COUNT=$(copy_listed "$GENERIC_LIST" /tmp/dlkm-out/vendor_dlkm/lib/modules)
            else
              echo "::warning::No vendor_dlkm.modules.load / system_dlkm.modules.load / modules.load manifest found anywhere in the tree — copying ALL built .ko into vendor_dlkm/lib/modules as a safe default. Verify against your device's actual partition layout (check an extracted stock vendor_boot/vendor_dlkm for the real split) before flashing."
              for ko in $ALL_KO; do
                cp "$ko" /tmp/dlkm-out/vendor_dlkm/lib/modules/
                VENDOR_COUNT=$((VENDOR_COUNT + 1))
              done
            fi
          fi

          echo "vendor_dlkm modules staged: $VENDOR_COUNT"
          echo "system_dlkm modules staged: $SYSTEM_COUNT"

          # Zip each partition's module set separately so they're easy to
          # push with `adb push` / repack into an existing vendor_dlkm.img
          # without needing an Android build tree here.
          if [ "$VENDOR_COUNT" -gt 0 ]; then
            (cd /tmp/dlkm-out/vendor_dlkm && zip -r9 -q /tmp/dlkm-out/vendor_dlkm-modules.zip lib)
          fi
          if [ "$SYSTEM_COUNT" -gt 0 ]; then
            (cd /tmp/dlkm-out/system_dlkm && zip -r9 -q /tmp/dlkm-out/system_dlkm-modules.zip lib)
          fi

          {
            echo "## vendor_dlkm / system_dlkm module packaging"
            echo
            echo "| Partition | Manifest used | Modules staged |"
            echo "|---|---|---|"
            echo "| vendor_dlkm | ${VENDOR_LIST:-${GENERIC_LIST:-'(none — all modules, safe default)'}} | $VENDOR_COUNT |"
            echo "| system_dlkm | ${SYSTEM_LIST:-'(not present on this tree)'} | $SYSTEM_COUNT |"
            echo
            echo "Every module here already passed the vermagic check in the previous step — nothing foreign or stale from another commit can reach this packaging stage."
            echo
            echo "**Note:** this stages the modules only (\`vendor_dlkm-modules.zip\` / \`system_dlkm-modules.zip\`). Producing a flashable \`vendor_dlkm.img\`/\`system_dlkm.img\` from scratch needs the device's fs_config/file_contexts + \`build_image.py\` from a full Android build tree, which isn't available in a bare kernel checkout — repack these modules into your existing stock image (or flash via AnyKernel3's \`do.modules=1\`, already wired up above) instead."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Locate a vendor_boot image to carry through (best-effort)
        # WHY THIS STEP EXISTS -- "upload ... vendor_boot":
        #
        # A from-scratch vendor_boot.img needs mkbootimg plus device-specific
        # header/base-address/cmdline/page-size parameters that live in the
        # device tree's BoardConfig, not in this kernel repo. What THIS
        # workflow can safely do is: if build.sh already produced/repacked a
        # vendor_boot.img (some QCOM build.sh variants do this when a stock
        # vendor_boot template + mkbootimg args are checked into the repo),
        # or a prebuilt template ships in the repo itself, surface it as an
        # artifact. Otherwise, say so plainly instead of guessing at boot
        # image parameters that could produce an unbootable image.
        if: always()
        run: |
          set -e
          mkdir -p /tmp/vendor-boot-out
          FOUND=$(find . out -maxdepth 6 -iname "vendor_boot.img" -not -path "./proton-clang/*" 2>/dev/null | head -n1 || true)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" /tmp/vendor-boot-out/vendor_boot.img
            echo "Found vendor_boot.img at: $FOUND"
            echo "## vendor_boot" >> "$GITHUB_STEP_SUMMARY"
            echo "Found and included: \`$FOUND\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No vendor_boot.img found anywhere in the tree or build output. This kernel repo doesn't carry mkbootimg parameters for this device, so one can't be safely generated here — pull vendor_boot from your last full ROM/vendor build and repack the new Image/dtb into it manually (or add a template + mkbootimg invocation to build.sh)."
            echo "## vendor_boot" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Not found — see step log for why and what to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Locate build outputs
        id: outputs
        if: always()
        run: |
          {
            echo "found<<EOF"
            ARCH="${{ github.event.inputs.arch || 'arm64' }}"
            find out/arch/"$ARCH"/boot -maxdepth 1 \( -iname "Image*" -o -iname "*.dtb" -o -iname "dtbo.img" \) 2>/dev/null || true
            find /tmp/anykernel-out -maxdepth 1 -iname "*.zip" 2>/dev/null || true
            find /tmp/dlkm-out -maxdepth 1 -iname "*.zip" 2>/dev/null || true
            find /tmp/vendor-boot-out -maxdepth 1 -iname "vendor_boot.img" 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomx-kernel-kernelsu-next-legacy
          path: |
            out/arch/*/boot/Image*
            out/arch/*/boot/*.dtb
            out/arch/*/boot/dtbo.img
            /tmp/anykernel-out/*.zip
            patch-report.txt
          if-no-files-found: error

      - name: Upload vendor_dlkm / system_dlkm module packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomx-kernel-vendor-system-dlkm
          path: |
            /tmp/dlkm-out/vendor_dlkm-modules.zip
            /tmp/dlkm-out/system_dlkm-modules.zip
          if-no-files-found: warn

      - name: Upload vendor_boot (when found)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomx-kernel-vendor-boot
          path: /tmp/vendor-boot-out/vendor_boot.img
          if-no-files-found: warn

      - name: Upload standalone .ko modules (wifi/FM + everything else built)
        # Separate from the main artifact above so you can grab just the
        # .ko files to manually swap into an extracted vendor_boot.img /
        # vendor_dlkm.img, without needing to unpack the AnyKernel3 zip.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomx-kernel-modules-ko
          path: out/**/*.ko
          if-no-files-found: warn

      - name: Upload debug logs (vermagic report, Module.symvers, build log)
        # WHY THIS STEP EXISTS -- "logs detalhados para facilitar o debug":
        # Everything needed to diagnose a vermagic mismatch, a missing
        # module, or a compiler/linker failure, in one place, without having
        # to re-run the job with debug logging enabled.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomx-kernel-debug-logs
          path: |
            vermagic-report.txt
            out/Module.symvers
            /tmp/build.log
            /tmp/build-errors.log
            patch-report.txt
          if-no-files-found: ignore
