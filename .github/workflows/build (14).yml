name: Atom Dubai Kernel Build

on:
  workflow_dispatch:
  push:
    branches:
      - topaz-rebase

jobs:
  build:
    name: Build Kernel 5.4 Dubai
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Atom
      KBUILD_BUILD_HOST: GitHub-Actions

    steps:

    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: topaz-rebase


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          build-essential \
          ccache \
          curl \
          flex \
          gcc-aarch64-linux-gnu \
          git \
          libelf-dev \
          libssl-dev \
          python3 \
          unzip \
          zip


    - name: Setup ccache
      run: |
        ccache -M 5G


    # Proton Clang para Android kernel 5.4
    - name: Download Proton Clang
      run: |
        git clone --depth=1 \
          https://github.com/kdrag0n/proton-clang \
          clang


    - name: Remove embedded KernelSU
      run: |
        echo "Removendo KernelSU embutido em drivers/kernelsu..."

        rm -rf drivers/kernelsu

        # Remove a linha "source drivers/kernelsu/kernel/Kconfig" do Kconfig dos drivers
        sed -i '/kernelsu/d' drivers/Kconfig

        # Remove a linha "obj-$(CONFIG_KSU) += kernelsu/" do Makefile dos drivers
        sed -i '/kernelsu/d' drivers/Makefile

        # Remove qualquer CONFIG_KSU hardcoded no defconfig do dispositivo
        sed -i '/CONFIG_KSU/d' arch/arm64/configs/vendor/dubai-qgki_defconfig 2>/dev/null || \
        find . -maxdepth 6 -iname "dubai-qgki_defconfig" \
          -exec sed -i '/CONFIG_KSU/d' {} \; 2>/dev/null || true

        echo "Conferindo se ainda ha referencias a drivers/kernelsu:"
        grep -rn "kernelsu" drivers/Makefile drivers/Kconfig || echo "Nenhuma referencia restante."


    - name: Install KernelSU-Next
      run: |
        # De volta ao modo kprobe (tag padrao "next"). O "legacy" exige um
        # patch oficial especifico de hooks manuais (nomes de funcao/macros
        # exatos que o Kbuild reconhece) - as chamadas ksu_handle_* que
        # sobraram em fs/*.c sao de uma implementacao antiga, com assinatura
        # diferente, entao o Kbuild do legacy nao as reconhece e falha com
        # "No hooks were defined" mesmo com codigo presente no arquivo.
        # O caminho kprobe ja chegou muito perto de funcionar (Kconfig ok,
        # CONFIG_KSU=y confirmado, build avancando), so faltando o shim de
        # linux/pgtable.h que ja adicionamos - por isso voltamos pra ele.
        curl -LSs \
          "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
          | bash -


    - name: Remove stale manual KernelSU hook call sites
      run: |
        python3 - <<'EOF'
        import re

        def sub_or_die(pattern, repl, text, path, count=1):
            new_text, n = re.subn(pattern, repl, text, count=count, flags=re.DOTALL)
            if n == 0:
                raise SystemExit(f"ERRO: padrao nao encontrado em {path}: {pattern!r}")
            print(f"{path}: {n} ocorrencia(s) removida(s) para {pattern[:40]!r}...")
            return new_text

        # fs/open.c
        path = "fs/open.c"
        with open(path) as f:
            text = f.read()
        text = sub_or_die(r"extern\s+int\s+ksu_handle_faccessat\([^;]*\);\s*\n", "", text, path)
        text = sub_or_die(r"[ \t]*ksu_handle_faccessat\(&dfd,\s*&filename,\s*&mode,\s*NULL\);\s*\n", "", text, path)
        with open(path, "w") as f:
            f.write(text)

        # fs/exec.c
        path = "fs/exec.c"
        with open(path) as f:
            text = f.read()
        text = sub_or_die(
            r"extern\s+bool\s+ksu_execveat_hook[^;]*;\s*"
            r"extern\s+int\s+ksu_handle_execveat\([^;]*\);\s*"
            r"extern\s+int\s+ksu_handle_execveat_sucompat\([^;]*\);\s*\n",
            "", text, path)
        text = sub_or_die(
            r"[ \t]*if\s*\(unlikely\(ksu_execveat_hook\)\)\s*"
            r"ksu_handle_execveat\([^;]*\);\s*"
            r"else\s*"
            r"ksu_handle_execveat_sucompat\([^;]*\);\s*\n",
            "", text, path)
        with open(path, "w") as f:
            f.write(text)

        # fs/stat.c
        path = "fs/stat.c"
        with open(path) as f:
            text = f.read()
        text = sub_or_die(r"extern\s+int\s+ksu_handle_stat\([^;]*\);\s*\n", "", text, path)
        text = sub_or_die(r"[ \t]*ksu_handle_stat\(&dfd,\s*&filename,\s*&flags\);\s*\n", "", text, path)
        with open(path, "w") as f:
            f.write(text)

        # fs/read_write.c
        path = "fs/read_write.c"
        with open(path) as f:
            text = f.read()
        text = sub_or_die(
            r"extern\s+bool\s+ksu_vfs_read_hook[^;]*;\s*"
            r"extern\s+int\s+ksu_handle_vfs_read\([^;]*\);\s*\n",
            "", text, path)
        text = sub_or_die(
            r"[ \t]*if\s*\(unlikely\(ksu_vfs_read_hook\)\)\s*"
            r"ksu_handle_vfs_read\([^;]*\);\s*\n",
            "", text, path)
        with open(path, "w") as f:
            f.write(text)

        print("Todas as remocoes foram aplicadas com sucesso.")
        EOF

        echo
        echo "Conferindo se restou alguma referencia:"
        grep -rn "ksu_handle_faccessat\|ksu_execveat_hook\|ksu_handle_execveat\|ksu_handle_stat\|ksu_vfs_read_hook\|ksu_handle_vfs_read" \
          fs/exec.c fs/open.c fs/stat.c fs/read_write.c || echo "Nenhuma referencia restante."


    - name: Apply SUSFS for KernelSU-Next (kernel 5.4)
      run: |
        # Patch especifico para essa arvore de kernel 5.4, deve estar
        # commitado no repo em patches/susfs_patch_to_5_4.patch
        PATCH_FILE="patches/susfs_patch_to_5_4.patch"

        if [ ! -f "$PATCH_FILE" ]; then
          echo "ERRO: $PATCH_FILE nao encontrado no repositorio."
          echo "Suba o patch para esse caminho antes de rodar o build."
          exit 1
        fi

        patch -p1 < "$PATCH_FILE"


    - name: Add linux/pgtable.h compat shim (kernel 5.4 predates this header)
      run: |
        # drivers/kernelsu/feature/sucompat.c inclui <linux/pgtable.h>, que so
        # foi introduzido no Linux mainline a partir da ~5.9/5.10 (unificacao
        # dos headers de pgtable por arquitetura). Kernel 5.4 nao tem esse
        # arquivo, so asm/pgtable.h - e o build quebra com:
        #   fatal error: 'linux/pgtable.h' file not found
        # Solucao padrao usada por arvores de kernel antigas que recebem
        # drivers mais novos: criar um shim de compatibilidade.
        mkdir -p include/linux

        if [ ! -f include/linux/pgtable.h ]; then
          printf '%s\n' \
            '#ifndef _LINUX_PGTABLE_H' \
            '#define _LINUX_PGTABLE_H' \
            '#include <asm/pgtable.h>' \
            '#endif' \
            > include/linux/pgtable.h
          echo "Criado include/linux/pgtable.h (shim para asm/pgtable.h)."
        else
          echo "include/linux/pgtable.h ja existe no repo, nao mexi."
        fi

        echo "Conteudo final:"
        cat include/linux/pgtable.h


    - name: Add strncpy_from_user_nofault compat shim (kernel 5.4 predates the maccess rename)
      run: |
        # drivers/kernelsu/feature/sucompat.c chama strncpy_from_user_nofault(),
        # que so recebeu esse nome a partir da Linux ~5.8 (rename de
        # strncpy_from_unsafe_user). Essa arvore 5.4 QGKI nao tem nenhum dos
        # dois nomes em include/linux/uaccess.h, entao o build quebra com:
        #   implicit declaration of function 'strncpy_from_user_nofault'
        # O proprio Kbuild do KernelSU-Next faz "grep strncpy_from_user_nofault
        # include/linux/uaccess.h" pra decidir uma flag de compat - entao
        # implementamos a funcao de verdade nesse mesmo header (padrao
        # classico do kernel: pagefault_disable/enable em volta de
        # strncpy_from_user, que existe em qualquer versao).
        UACCESS_H="include/linux/uaccess.h"

        if grep -q "strncpy_from_user_nofault" "$UACCESS_H"; then
          echo "strncpy_from_user_nofault ja referenciado em $UACCESS_H, nao mexi."
        else
          printf '%s\n' \
            '' \
            '/* Compat shim: kernel 5.4 nao tem strncpy_from_user_nofault nem strncpy_from_unsafe_user. */' \
            '#ifndef _KSU_COMPAT_STRNCPY_FROM_USER_NOFAULT' \
            '#define _KSU_COMPAT_STRNCPY_FROM_USER_NOFAULT' \
            'static inline long strncpy_from_user_nofault(char *dst,' \
            '                                              const void __user *unsafe_addr,' \
            '                                              long count)' \
            '{' \
            '    long ret;' \
            '' \
            '    if (count <= 0)' \
            '        return 0;' \
            '' \
            '    pagefault_disable();' \
            '    ret = strncpy_from_user(dst, (const char __user *)unsafe_addr, count);' \
            '    pagefault_enable();' \
            '' \
            '    if (ret >= count) {' \
            '        ret = count;' \
            '        dst[count - 1] = 0;' \
            '    } else if (ret > 0) {' \
            '        dst[ret] = 0;' \
            '    }' \
            '' \
            '    return ret;' \
            '}' \
            '#endif' \
            >> "$UACCESS_H"
          echo "Adicionado wrapper strncpy_from_user_nofault em $UACCESS_H."
        fi

        echo "Conferindo:"
        tail -25 "$UACCESS_H"


    - name: Add copy_to_kernel_nofault compat shim (kernel 5.4 predates the maccess rename)
      run: |
        # drivers/kernelsu/hook/arm64/patch_memory.c chama
        # copy_to_kernel_nofault(), nome novo (Linux ~5.8+) para
        # probe_kernel_write() - usada pra escrever bytes na memoria do
        # kernel (patch das instrucoes do hook) com pagefault desabilitado.
        # Kernel 5.4 so tem o nome antigo probe_kernel_write, ja declarado
        # nesse mesmo include/linux/uaccess.h - entao so precisamos de um
        # wrapper com o nome novo por cima da funcao antiga.
        UACCESS_H="include/linux/uaccess.h"

        if grep -q "copy_to_kernel_nofault" "$UACCESS_H"; then
          echo "copy_to_kernel_nofault ja referenciado em $UACCESS_H, nao mexi."
        else
          printf '%s\n' \
            '' \
            '/* Compat shim: kernel 5.4 so tem probe_kernel_write (pre-rename). */' \
            '#ifndef _KSU_COMPAT_COPY_TO_KERNEL_NOFAULT' \
            '#define _KSU_COMPAT_COPY_TO_KERNEL_NOFAULT' \
            'static inline long copy_to_kernel_nofault(void *dst, const void *src, size_t size)' \
            '{' \
            '    return probe_kernel_write(dst, src, size);' \
            '}' \
            '#endif' \
            >> "$UACCESS_H"
          echo "Adicionado wrapper copy_to_kernel_nofault em $UACCESS_H."
        fi

        echo "Conferindo:"
        tail -15 "$UACCESS_H"


    - name: Add security_inode_init_security_anon compat shim (kernel 5.4 predates this LSM hook)
      run: |
        # drivers/kernelsu/infra/file_wrapper.c chama
        # security_inode_init_security_anon(), hook de LSM para rotular
        # inodes anonimos (anon_inode_getfile) que so foi introduzido no
        # Linux mainline bem depois da 5.4. Essa arvore 5.4 QGKI nao tem
        # essa funcao em include/linux/security.h, so a
        # security_inode_init_security "normal" - entao o build quebra com:
        #   implicit declaration of function 'security_inode_init_security_anon'
        # Como a infraestrutura de rotulagem de inode anonimo nem existe
        # nessa versao do kernel, o shim correto e um stub que retorna 0 -
        # exatamente o que a propria versao mainline faz quando
        # CONFIG_SECURITY esta desligado.
        SECURITY_H="include/linux/security.h"

        if grep -q "security_inode_init_security_anon" "$SECURITY_H"; then
          echo "security_inode_init_security_anon ja referenciado em $SECURITY_H, nao mexi."
        else
          printf '%s\n' \
            '' \
            '/* Compat shim: kernel 5.4 nao tem security_inode_init_security_anon. */' \
            '#ifndef _KSU_COMPAT_SECURITY_INODE_INIT_SECURITY_ANON' \
            '#define _KSU_COMPAT_SECURITY_INODE_INIT_SECURITY_ANON' \
            'static inline int security_inode_init_security_anon(struct inode *inode,' \
            '                                                     const struct qstr *name,' \
            '                                                     const struct inode *context_inode)' \
            '{' \
            '    return 0;' \
            '}' \
            '#endif' \
            >> "$SECURITY_H"
          echo "Adicionado stub security_inode_init_security_anon em $SECURITY_H."
        fi

        echo "Conferindo:"
        tail -15 "$SECURITY_H"


    - name: Debug KernelSU-Next Kconfig wiring
      run: |
        echo "== Linha de source em drivers/Kconfig =="
        grep -n "kernelsu" drivers/Kconfig || echo "Nenhuma linha 'source' encontrada!"

        echo
        echo "== Linha de obj em drivers/Makefile =="
        grep -n "kernelsu" drivers/Makefile || echo "Nenhuma linha 'obj' encontrada!"

        echo
        echo "== drivers/kernelsu resolvido (symlink?) =="
        ls -la drivers/kernelsu || echo "drivers/kernelsu nao existe!"
        readlink -f drivers/kernelsu || true

        echo
        echo "== Stanza 'config KSU' no Kconfig do driver =="
        KSU_KCONFIG=$(readlink -f drivers/kernelsu)/Kconfig
        if [ -f "$KSU_KCONFIG" ]; then
          grep -A 6 "^config KSU$" "$KSU_KCONFIG" || echo "Simbolo 'config KSU' nao encontrado em $KSU_KCONFIG"
        else
          echo "Arquivo $KSU_KCONFIG nao existe!"
        fi


    - name: Configure kernel
      run: |

        export PATH=$PWD/clang/bin:$PATH

        make O=out \
          ARCH=arm64 \
          vendor/dubai-qgki_defconfig


    - name: Enable KPROBES/EXT4_FS deps for KernelSU-Next
      run: |
        # config KSU depends on KPROBES && EXT4_FS (ver drivers/kernelsu/Kconfig).
        # Precisa habilitar (e resolver) essa dependencia ANTES de tentar
        # habilitar KSU, senao o olddefconfig da etapa seguinte derruba o KSU
        # de volta pra "n" silenciosamente e o build passa "verde" sem KernelSU.
        #
        # KPROBES por sua vez depende de MODULES && HAVE_KPROBES (Kconfig
        # mainline). HAVE_KPROBES normalmente ja vem selecionado pelo arch
        # arm64, mas MODULES costuma estar desligado em defconfig de vendor
        # kernel monolitico - por isso habilitamos ele tambem aqui.
        scripts/config --file out/.config \
          -e MODULES \
          -e KPROBES \
          -e KPROBES_QGKI \
          -e EXT4_FS

        make O=out \
          ARCH=arm64 \
          olddefconfig

        echo "Conferindo se MODULES/KPROBES/KPROBES_QGKI/EXT4_FS realmente ficaram habilitados:"
        grep -E "^CONFIG_MODULES=|^CONFIG_KPROBES=|^CONFIG_KPROBES_QGKI=|^CONFIG_EXT4_FS=" out/.config || true

        if ! grep -q '^CONFIG_KPROBES=y' out/.config; then
          echo
          echo "AVISO: CONFIG_KPROBES ainda nao ficou =y depois do olddefconfig."
          echo "Provavelmente ha outra dependencia nao satisfeita alem de MODULES."
          echo "Diagnostico: estado atual das dependencias relevantes:"
          scripts/config --file out/.config --state MODULES || true
          scripts/config --file out/.config --state KPROBES || true
          scripts/config --file out/.config --state HAVE_KPROBES || true
          echo
          echo "Stanza(s) 'config KPROBES' / 'config HAVE_KPROBES' encontradas na arvore:"
          grep -rn -A 6 "^config KPROBES$" arch/arm64/Kconfig kernel/Kconfig* lib/Kconfig* 2>/dev/null || true
          grep -rn -A 6 "^config HAVE_KPROBES$" arch/arm64/Kconfig arch/Kconfig 2>/dev/null || true
          echo
          echo "(A etapa seguinte de verificacao final ainda vai abortar o build"
          echo "se CONFIG_KSU nao sair =y, mas esse diagnostico ajuda a achar a"
          echo "dependencia real que falta antes de tentar de novo.)"
        fi


    - name: Enable KernelSU-Next & SUSFS configs
      run: |
        scripts/config --file out/.config \
          -e KSU \
          -e KSU_SUSFS \
          -e KSU_SUSFS_SUS_PATH \
          -e KSU_SUSFS_SUS_MOUNT \
          -e KSU_SUSFS_SUS_KSTAT \
          -e KSU_SUSFS_TRY_UMOUNT \
          -e KSU_SUSFS_SPOOF_UNAME \
          -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          -e KSU_SUSFS_ENABLE_LOG

        make O=out \
          ARCH=arm64 \
          olddefconfig


    - name: Verify KernelSU-Next is actually enabled (fail build otherwise)
      run: |
        echo "Checking KernelSU-Next / SUSFS configs..."
        grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS" out/.config || true

        if ! grep -q '^CONFIG_KSU=y' out/.config; then
          echo
          echo "ERRO FATAL: CONFIG_KSU nao esta habilitado (=y) no .config final."
          echo "O olddefconfig provavelmente desligou o KSU por falta de"
          echo "KPROBES e/ou EXT4_FS. Build abortado de proposito para nao"
          echo "gerar um zip 'verde' sem KernelSU dentro."
          exit 1
        fi

        echo "OK: CONFIG_KSU=y confirmado no .config final."


    - name: Verify WiFi configs
      run: |

        echo "Checking WLAN configs..."

        grep -E \
        "CFG80211|MAC80211|CNSS|QCA|WLAN|ICNSS" \
        out/.config || true


    - name: Build kernel
      run: |

        export PATH=$PWD/clang/bin:$PATH

        make \
          -j$(nproc) \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip


    - name: Collect kernel output
      run: |

        mkdir release

        cp out/arch/arm64/boot/Image release/


        find out/arch/arm64/boot \
        -name "*.dtb" \
        -exec cp {} release/ \; || true


        find out/arch/arm64/boot \
        -name "*.dtbo" \
        -exec cp {} release/ \; || true



    - name: Clone AnyKernel3
      run: |

        git clone --depth=1 \
        https://github.com/osm0sis/AnyKernel3 \
        anykernel


    - name: Prepare AnyKernel3
      run: |

        cp release/* anykernel/


        cd anykernel


        # Edge 30 A/B
        sed -i \
        's/do.devicecheck=.*/do.devicecheck=0/' \
        anykernel.sh || true


        sed -i \
        's/device.name1=.*/device.name1=dubai/' \
        anykernel.sh || true



    - name: Build Flashable ZIP
      run: |

        cd anykernel

        zip -r9 \
        ../Atom-Dubai-Kernel.zip \
        . \
        -x "*.git*"



    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:

        name: Atom-Dubai-Kernel

        path: Atom-Dubai-Kernel.zip
