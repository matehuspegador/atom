name: Compare WiFi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-wifi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo (sparse)
        shell: bash
        run: |
          rm -rf .git

          git init
          git remote add origin https://github.com/${{ github.repository }}.git

          git config core.sparseCheckout true

          mkdir -p .git/info

          cat > .git/info/sparse-checkout <<'EOF'
          drivers/staging/qcacld-3.0
          drivers/staging/qca-wifi-host-cmn
          drivers/net/wireless/cnss2
          include
          net
          arch/arm64/configs/vendor/dubai-qgki_defconfig
          EOF

          git fetch --depth=1 origin topaz-rebase
          git checkout FETCH_HEAD

      - name: Clone base kernel (sparse)
        shell: bash
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            -b topaz-rebase \
            https://github.com/SM7325-AE/android_kernel_motorola_dubai.git \
            base

          cd base

          git sparse-checkout set \
            drivers/staging/qcacld-3.0 \
            drivers/staging/qca-wifi-host-cmn \
            drivers/net/wireless/cnss2 \
            include \
            net \
            arch/arm64/configs/vendor/dubai-qgki_defconfig

      - name: Generate diffs
        shell: bash
        run: |
          mkdir -p diff

          compare() {
            DIR="$1"
            OUT="diff/${DIR//\//_}.diff"

            if [ -d "base/$DIR" ] && [ -d "$DIR" ]; then
              git diff --no-index \
                "base/$DIR" \
                "$DIR" \
                > "$OUT" || true

              [ ! -s "$OUT" ] && rm -f "$OUT"
            fi
          }

          compare drivers/staging/qcacld-3.0
          compare drivers/staging/qca-wifi-host-cmn
          compare drivers/net/wireless/cnss2
          compare include
          compare net

          CONF=arch/arm64/configs/vendor/dubai-qgki_defconfig

          if [ -f "base/$CONF" ] && [ -f "$CONF" ]; then
            git diff --no-index \
              "base/$CONF" \
              "$CONF" \
              > diff/dubai-qgki_defconfig.diff || true

            [ ! -s diff/dubai-qgki_defconfig.diff ] && rm -f diff/dubai-qgki_defconfig.diff
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wifi-comparison
          path: diff
          if-no-files-found: warn
