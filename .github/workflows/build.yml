name: Atom Dubai Kernel Build

on:
  workflow_dispatch:
  push:
    branches:
      - topaz-rebase

jobs:
  build:
    name: Build Kernel 5.4 Dubai
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Atom
      KBUILD_BUILD_HOST: GitHub-Actions

    steps:

    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: topaz-rebase


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          build-essential \
          ccache \
          curl \
          flex \
          gcc-aarch64-linux-gnu \
          git \
          libelf-dev \
          libssl-dev \
          python3 \
          unzip \
          zip


    - name: Setup ccache
      run: |
        ccache -M 5G


    # Proton Clang para Android kernel 5.4
    - name: Download Proton Clang
      run: |
        git clone --depth=1 \
          https://github.com/kdrag0n/proton-clang \
          clang


    - name: Remove embedded KernelSU
      run: |
        echo "Removendo KernelSU embutido em drivers/kernelsu..."

        rm -rf drivers/kernelsu

        # Remove a linha "source drivers/kernelsu/Kconfig" do Kconfig dos drivers
        sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig

        # Remove a linha "obj-$(CONFIG_KSU) += kernelsu/" do Makefile dos drivers
        sed -i '/kernelsu/d' drivers/Makefile

        # Remove qualquer CONFIG_KSU hardcoded no defconfig do dispositivo
        sed -i '/CONFIG_KSU/d' arch/arm64/configs/vendor/dubai-qgki_defconfig 2>/dev/null || \
        find . -maxdepth 6 -iname "dubai-qgki_defconfig" \
          -exec sed -i '/CONFIG_KSU/d' {} \; 2>/dev/null || true

        echo "Conferindo se ainda ha referencias a drivers/kernelsu:"
        grep -rn "kernelsu" drivers/Makefile drivers/Kconfig || echo "Nenhuma referencia restante."


    - name: Install KernelSU-Next
      run: |
        curl -LSs \
          "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
          | bash -


    - name: Apply SUSFS for KernelSU-Next (kernel 5.4)
      run: |
        # susfs4ksu tem uma branch dedicada para kernel 5.4 (non-GKI)
        git clone --depth=1 --branch kernel-5.4 \
          https://gitlab.com/simonpunk/susfs4ksu \
          susfs4ksu

        # Nucleo do SUSFS no kernel (fs/ + include/linux/)
        cp susfs4ksu/kernel_patches/fs/susfs.c fs/
        cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
        cp susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.4.patch .

        patch -p1 < 50_add_susfs_in_kernel-5.4.patch || \
          echo "AVISO: alguns hunks do patch do kernel podem ter falhado, revise manualmente."

        # Integracao do SUSFS especifica para o fork KernelSU-Next
        curl -LSs \
          "https://raw.githubusercontent.com/galaxybuild-project/tools/refs/heads/main/Patches/0001susfs157forksunext.patch" \
          -o ksun_susfs.patch

        cd KernelSU-Next
        patch -p1 < ../ksun_susfs.patch || \
          echo "AVISO: alguns hunks do patch do KernelSU-Next podem ter falhado, revise manualmente."
        cd ..

        rm -f 50_add_susfs_in_kernel-5.4.patch ksun_susfs.patch


    - name: Configure kernel
      run: |

        export PATH=$PWD/clang/bin:$PATH

        make O=out \
          ARCH=arm64 \
          vendor/dubai-qgki_defconfig


    - name: Enable KernelSU-Next & SUSFS configs
      run: |
        scripts/config --file out/.config \
          -e KSU \
          -e KSU_SUSFS \
          -e KSU_SUSFS_SUS_PATH \
          -e KSU_SUSFS_SUS_MOUNT \
          -e KSU_SUSFS_SUS_KSTAT \
          -e KSU_SUSFS_TRY_UMOUNT \
          -e KSU_SUSFS_SPOOF_UNAME \
          -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          -e KSU_SUSFS_ENABLE_LOG

        make O=out \
          ARCH=arm64 \
          olddefconfig


    - name: Verify WiFi configs
      run: |

        echo "Checking WLAN configs..."

        grep -E \
        "CFG80211|MAC80211|CNSS|QCA|WLAN|ICNSS" \
        out/.config || true

        echo "Checking KernelSU-Next / SUSFS configs..."

        grep -E \
        "CONFIG_KSU|CONFIG_KSU_SUSFS" \
        out/.config || true


    - name: Build kernel
      run: |

        export PATH=$PWD/clang/bin:$PATH

        make \
          -j$(nproc) \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip


    - name: Collect kernel output
      run: |

        mkdir release

        cp out/arch/arm64/boot/Image release/


        find out/arch/arm64/boot \
        -name "*.dtb" \
        -exec cp {} release/ \; || true


        find out/arch/arm64/boot \
        -name "*.dtbo" \
        -exec cp {} release/ \; || true



    - name: Clone AnyKernel3
      run: |

        git clone --depth=1 \
        https://github.com/osm0sis/AnyKernel3 \
        anykernel


    - name: Prepare AnyKernel3
      run: |

        cp release/* anykernel/


        cd anykernel


        # Edge 30 A/B
        sed -i \
        's/do.devicecheck=.*/do.devicecheck=0/' \
        anykernel.sh || true


        sed -i \
        's/device.name1=.*/device.name1=dubai/' \
        anykernel.sh || true



    - name: Build Flashable ZIP
      run: |

        cd anykernel

        zip -r9 \
        ../Atom-Dubai-Kernel.zip \
        . \
        -x "*.git*"



    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:

        name: Atom-Dubai-Kernel

        path: Atom-Dubai-Kernel.zip
